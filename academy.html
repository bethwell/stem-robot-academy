  .btn-clear { background: #e5e7eb; border-radius: 16px; padding: 12px 16px; font-size: 1rem; }
  .grid-wrap { display: flex; flex-direction: column; align-items: center; }

  .toggle.on-amber { background: #ff8c00; color: #fff; } .toggle.on-green { background: #0d9488; color: #fff; }

  #basket { position: absolute; font-size: 2.2rem; transform: translateX(-50%); pointer-events: none; }
  .game-overlay { position: absolute; inset: 0; background: rgba(7,27,51,.4); backdrop-filter: blur(3px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .game-overlay .t { color: #fff; font-weight: 900; font-size: 1.2rem; text-align: center; padding: 0 16px; }
  .game-overlay .start { background: #ff8c00; color: #fff; font-weight: 900; border-radius: 999px; padding: 12px 32px; font-size: 1rem; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #071b33; color: #fff; font-weight: 900; border-radius: 999px; padding: 12px 26px; box-shadow: 0 8px 24px rgba(0,0,0,.3); font-size: .85rem; z-index: 50; display: none; animation: fadeUp .3s; }

</style>

<script>
/* ================= DATA ================= */
var LESSONS = [
  { emoji:"🤖", title:"What is a Robot?", age:"5+", level:1, video:"zBmWU-qEJBQ", track:"Mini-makers Track", color:"linear-gradient(90deg,#38bdf8,#0066cc)",
    content:["A robot is a machine that can SENSE, THINK, and ACT! 🦾","👀 SENSE: Robots use sensors like cameras and touch buttons to see and feel the world.","🧠 THINK: A computer brain decides what to do.","🏃 ACT: Motors move wheels, arms, or legs to do the action!","You are a robot expert already — your body senses (eyes!), thinks (brain!), and acts (muscles!) the same way!"],
    quiz:{ q:"Which part helps a robot 'think'?", options:["Its wheels","Its computer brain","Its battery"], answer:1,
    fun:"Just like your brain tells your legs to run, a robot's computer tells its motors to spin!" } },
  { emoji:"👁️", title:"Super Sensors", age:"7+", level:1, track:"Mega-makers Track", color:"linear-gradient(90deg,#0d9488,#0f766e)",
    content:["Sensors are a robot's superpowers! 🦸","📷 Camera → helps robots see shapes, faces and colors.","📏 Distance (ultrasonic) sensor → works like bat echo! It bounces sound to measure how far a wall is.","🎛️ Touch sensor → feels bumps, like when you touch something hot and pull back!","🧭 Compass / gyroscope → tells the robot which way it is facing.","Robots use MANY sensors together, just like you use your eyes AND ears at the same time."],
    quiz:{ q:"A bat-like sensor that measures distance is called…", options:["Ultrasonic sensor","Color sensor","Sound sensor"], answer:0,
    fun:"Bats send out squeaks and listen for the echo. Ultrasonic sensors do exactly the same with sound waves!" } },
  { emoji:"🔁", title:"Loops & Code Blocks", age:"8+", level:2, track:"Mega-makers & Sumo-makers", color:"linear-gradient(90deg,#ffb466,#ff8c00)",
    content:["Computers follow instructions STEP BY STEP, like a recipe! 📝","A LOOP tells the computer: 'do this again and again!' 🔁","Instead of writing 'move forward' 4 times, we can say: repeat 4 [move forward].","This is how kid coders use Scratch and Blockly — colorful blocks that snap together like LEGO!","Try the Robot Coder zone to use REAL loops and drive a robot!"],
    quiz:{ q:"How do you make code repeat 4 times the smart way?", options:["Write it 4 times","Use a repeat loop","Shout louder at the robot"], answer:1,
    fun:"Programmers say: 'Don't Repeat Yourself!' Loops make code short, tidy and smart." } },
  { emoji:"⚡", title:"Electricity Power!", age:"6+", level:1, track:"Mega-makers Track", color:"linear-gradient(90deg,#facc15,#f59e0b)",
    content:["Robots need ENERGY to move. Where does it come from? Electricity! ⚡","A circuit is a loop that electricity travels around, like a race track! 🏁","Battery ⚡ → wire → motor → wire → back to battery. If the loop breaks, the robot stops!","A SWITCH is like a drawbridge on the road — open it and cars (electrons) stop!","Motors turn electricity into SPINNING motion. That's how robot wheels turn!"],
    quiz:{ q:"What happens if you break the loop in a circuit?", options:["Electricity flows faster","Electricity stops flowing","The robot dances"], answer:1,
    fun:"Electricity always needs a complete path from + to −. No loop, no power!" } },
  { emoji:"⚙️", title:"Gears & Simple Machines", age:"8+", level:2, track:"Mini-makers Track", color:"linear-gradient(90deg,#4f9cf9,#123a6b)",
    content:["Robots are built from simple machines — the same ones the ancient Egyptians used! 🏗️","⚙️ GEAR: a spiky wheel. Big gear + small gear = speed or power!","🔩 SCREW, 🪜 ramp, ⚖️ LEVER, 🔧 WHEEL & AXLE, ⚓ PULLEY.","Robotic arms use levers. Robotic grippers use gears and pulleys.","Fun fact: a bicycle is a simple machine robot you power with your legs!"],
    quiz:{ q:"Which simple machine is a spiky wheel?", options:["A pulley","A lever","A gear"], answer:2,
    fun:"Gears mesh like teeth! When one turns clockwise, its neighbor turns the opposite way!" } },
  { emoji:"🏗️", title:"Think Like an Engineer", age:"9+", level:1, track:"Sumo-makers Track", color:"linear-gradient(90deg,#f472b6,#db2777)",
    content:["Engineers solve problems with the DESIGN CYCLE: 🔁","1️⃣ ASK: What is the problem? 2️⃣ IMAGINE: brainstorm wild ideas!","3️⃣ PLAN: sketch the best idea. 4️⃣ CREATE: build it!","5️⃣ TEST: does it work? 6️⃣ IMPROVE: fix what failed and try again!","Failing is FINE — every real robot failed MANY times before it worked. Engineers say: fail, learn, improve! 💪"],
    quiz:{ q:"What should you do after a test fails?", options:["Give up","Improve and try again","Hide the robot"], answer:1,
    fun:"NASA's Mars rovers were tested for YEARS on Earth before launch. Failing is part of the plan!" } },

  { emoji:"🧪", title:"What is STEM?", age:"5+", level:1, track:"Mini-makers Track", color:"linear-gradient(90deg,#34d399,#22c55e)",
    content:["STEM = Science, Technology, Engineering, Math — the superpowers behind every robot! 🚀","🔬 Science asks WHY things happen. 💻 Technology builds tools that help people.","🏗️ Engineering solves problems by designing and building. 🔢 Math measures and counts it all.","Technology helps people every day: wheelchairs, hearing aids, phones, even farming tools!","Try it: invent your own robot game or build challenge — you are the engineer today!"],
    quiz:{ q:"What does the 'E' in STEM stand for?", options:["Electricity","Engineering","Energy"], answer:1,
    fun:"Engineers designed the water filter, the bicycle, and even your pencil. Engineering is everywhere!" } },
  { emoji:"🎈", title:"Energy, Motion & Machines", age:"5+", level:2, track:"Mini-makers Track", color:"linear-gradient(90deg,#f472b6,#ec4899)",
    content:["Everything that moves needs ENERGY — pushes and pulls are called FORCES! 💪","Air power is real energy: a balloon car zooms because escaping air pushes it forward!","Stored energy waits to be used — like a stretched rubber band or a wound-up spring.","Wheels reduce friction, so things roll further than they slide. That's why cars have wheels!","Wiggle bots and push cars show how energy becomes MOTION. Try racing yours with a friend!"],
    quiz:{ q:"Why does a balloon car move forward?", options:["Magic air fairies","Air rushes out backward and pushes the car forward","The balloon gets scared and runs"], answer:1,
    fun:"It's Newton's 3rd law: every push has an equal push back. Real rockets launch with the same rule!" } },
  { emoji:"🏗️", title:"Strong Structures", age:"5+", level:3, track:"Mini-makers Track", color:"linear-gradient(90deg,#60a5fa,#3b82f6)",
    content:["Engineers build with SHAPES — and the triangle is the strongest of all! 🔺","A wide, heavy base makes towers stable. That's why tall towers are wider at the bottom.","Bridges carry weight across gaps using strong shapes and support columns.","Clay and skewers can become amazing towers — if you test, fail, and improve!","Stability means not falling over. Test yours: can it survive a gentle table shake?"],
    quiz:{ q:"Which shape makes the strongest frame?", options:["Square","Triangle","Circle"], answer:1,
    fun:"The Eiffel Tower is made of thousands of triangles — that's why it has stood for over 130 years!" } },
  { emoji:"🔌", title:"Electronics: Circuits & LEDs", age:"7+", level:2, track:"Mega-makers Track", color:"linear-gradient(90deg,#fbbf24,#f59e0b)",
    content:["Electronics is about controlling electricity to do useful jobs — like lighting an LED! 💡","Every circuit needs a POWER SOURCE (battery) and a complete loop for current to flow.","INPUTS sense (a button), OUTPUTS act (a light or buzzer). Input → brain → output!","Conductors let electricity pass (metals). Insulators block it (plastic, wood, rubber).","Cardboard circuits and breadboards let you build real light-up projects safely!"],
    quiz:{ q:"Which material lets electricity pass through it?", options:["Plastic ruler","Metal spoon","Wooden stick"], answer:1,
    fun:"The copper inside wires is a great conductor — that's why nearly all wires use copper!" } },
  { emoji:"👀", title:"Sensors & Smart Systems", age:"7+", level:2, track:"Mega-makers Track", color:"linear-gradient(90deg,#2dd4bf,#0d9488)",
    content:["A SMART SYSTEM senses something, then reacts automatically — no human needed! 🤖","Robots 'see' with sensors: touch (a bump), light (bright/dark), and distance (how far).","Obstacle detection: a distance sensor tells the robot 'wall ahead!' so it can turn away.","It works like IF-THEN thinking: IF something is close, THEN turn. Sensors + rules = automation!","Automatic doors and street lights use the same idea: sense → decide → act."],
    quiz:{ q:"How does an automatic door 'know' to open?", options:["It hears your voice","A sensor detects you approaching","It opens every 5 seconds"], answer:1,
    fun:"Self-driving cars use dozens of sensors doing exactly this — millions of IF-THEN decisions every second!" } },
  { emoji:"💻", title:"Coding & Computational Thinking", age:"8+", level:3, track:"Mega-makers & Sumo-makers", color:"linear-gradient(90deg,#818cf8,#6366f1)",
    content:["An ALGORITHM is a step-by-step recipe for a computer. Computers follow it exactly! 📝","SEQUENCING matters: brush teeth → apply paste is very different from paste → brush!","EVENTS make programs interactive: 'when flag clicked' or 'when space key pressed'.","Scratch lets you snap colorful blocks together to move sprites and build games.","When code doesn't work, you DEBUG it — read carefully, find the bug, fix it, test again!"],
    quiz:{ q:"Finding and fixing an error in your code is called…", options:["Debugging","Deleting","Doodling"], answer:0,

var BLOCKS = { fwd:{label:"Move ⬆️"}, left:{label:"Turn ↰"}, right:{label:"Turn ↱"}, loopStart:{label:"Repeat ×"}, loopEnd:{label:"End repeat"} };
var DIRS = [{dx:0,dy:-1},{dx:1,dy:0},{dx:0,dy:1},{dx:-1,dy:0}];

function renderCoder(){
  var ch = CHALLENGES[S.challenge];
  if (S.robot === null) S.robot = { x:ch.start.x, y:ch.start.y, dir:0 };

    + '<p class="page-sub">Challenge '+(S.challenge+1)+': <b>'+ch.name+'</b> — '+ch.hint+'</p><div class="ch-pills">';
  CHALLENGES.forEach(function(c,i){ html += '<button class="pill'+(i===S.challenge?" active":"")+'" data-c="'+i+'">'+(i+1)+'. '+c.name+'</button>'; });
  html += '</div><div class="coder-grid-2"><div class="panel"><h3>🧩 Tap blocks to build your program:</h3><div class="palette">'
    + '<button class="blk-btn b-fwd" data-add="fwd">⬆️ Move</button>'
    + '<button class="blk-btn b-turn" data-add="left">↰ Turn left</button>'
    + '<button class="blk-btn b-turn" data-add="right">↱ Turn right</button>'
    + '<button class="blk-btn b-loop" data-add="loopStart">🔁 Repeat</button>'
    + '<button class="blk-btn b-loop" data-add="loopEnd">⏹ End repeat</button></div>'
    + '<h3>📝 Your program:</h3><div class="program" id="program">';
  if (S.program.length === 0) html += '<div class="empty">Tap blocks above to build your program…</div>';
  S.program.forEach(function(b,i){
    var t = BLOCKS[b.type];
    var bg = b.type==="fwd" ? "#0d9488" : (b.type==="loopStart"||b.type==="loopEnd") ? (b.type==="loopEnd"?"#ffd9a0":"#ff8c00") : "#0066cc";
    html += '<div class="blk-row">';
    if (b.type === "loopStart") html += '<input type="number" min="1" max="5" value="'+b.count+'" class="blk-count" data-cnt="'+i+'">';
    html += '<div class="blk'+(b.type==="loopEnd"?" end":"")+'" style="background:'+bg+'">'
      + '<span>'+t.label+'</span><button class="blk-del" data-del="'+i+'">×</button></div></div>';
  });
  html += '</div><div class="run-row"><button class="btn-run" id="run-btn" '+(S.running||S.program.length===0?"disabled":"")+'>'
    + (S.running?"▶ Running…":"▶ Run Program!")+'</button>'
    + '<button class="btn-clear" id="clear-btn">🗑️</button></div></div>'
    + '<div class="panel grid-wrap"><h3>🌍 Robot World</h3><div class="robot-grid" id="robot-grid" style="grid-template-columns:repeat('+ch.grid+', 52px)"></div>';
  if (S.coderMsg) html += '<div class="'+(S.coderMsg.ok?"msg-ok":"msg-no")+'">'+S.coderMsg.text+'</div>';
  html += '<p class="tiny-tip">🤖 arrow shows the direction. Turns rotate the robot in place.</p></div></div></div>';
  var app = el("app"); app.innerHTML = html;
  app.querySelectorAll("[data-c]").forEach(function(b){ b.onclick = function(){ var i=+b.getAttribute("data-c"); S.challenge=i; var c=CHALLENGES[i]; S.robot={x:c.start.x,y:c.start.y,dir:0}; S.program=[]; S.collected=[]; S.coderMsg=null; render(); }; });
  app.querySelectorAll("[data-add]").forEach(function(b){
    b.onclick = function(){
      if (S.running) return;
      var t = b.getAttribute("data-add");
      S.program.push(t==="loopStart" ? {type:t,count:2} : {type:t});
      S.coderMsg = null; render();
    };
  });
  app.querySelectorAll("[data-del]").forEach(function(b){ b.onclick = function(){ if(!S.running){ S.program.splice(+b.getAttribute("data-del"),1); render(); } }; });
  app.querySelectorAll("[data-cnt]").forEach(function(inp){
    inp.onchange = function(){ var i=+inp.getAttribute("data-cnt"); S.program[i].count = Math.max(1, Math.min(5, +inp.value||1)); render(); };
  });
  el("clear-btn").onclick = function(){ if(!S.running){ S.program=[]; S.robot={x:ch.start.x,y:ch.start.y,dir:0}; S.collected=[]; S.coderMsg=null; render(); } };
  el("run-btn").onclick = runProgram;
  drawGrid();
}

function drawGrid(){
  var ch = CHALLENGES[S.challenge]; var g = el("robot-grid"); if(!g) return;
  g.innerHTML = "";
  for (var y=0; y<ch.grid; y++){
    for (var x=0; x<ch.grid; x++){
      var c = document.createElement("div"); c.className = "cell"; c.style.width="52px"; c.style.height="52px";
      var isWall = ch.walls.some(function(w){ return w.x===x&&w.y===y; });
      var starIdx = ch.stars.findIndex(function(s){ return s.x===x&&s.y===y; });
      var hasStar = starIdx>=0 && S.collected.indexOf(starIdx)<0;
      var isGoal = ch.goal.x===x && ch.goal.y===y;
      var isRobot = S.robot.x===x && S.robot.y===y;
      if (isWall) c.textContent = "🧱";
      else if (hasStar) c.textContent = "⭐";
      else if (isGoal) c.textContent = "🏁";
      if (isRobot){
        var r = document.createElement("div"); r.className = "robot"; r.textContent = "🤖";
        r.style.transform = "rotate("+(S.robot.dir*90)+"deg)";
        c.appendChild(r);
      }
      g.appendChild(c);
    }
  }
}

function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

async function runProgram(){
  if (S.running || S.program.length===0) return;
  var ch = CHALLENGES[S.challenge];
  S.running = true; S.coderMsg = null; S.collected = [];
  S.robot = { x:ch.start.x, y:ch.start.y, dir:0 };
  render();
  await sleep(350);
  var state = S.robot, got = [];

  async function runBlock(b){
    if (b.type==="left") state = { x:state.x, y:state.y, dir:(state.dir+3)%4 };
    else if (b.type==="right") state = { x:state.x, y:state.y, dir:(state.dir+1)%4 };
    else if (b.type==="fwd"){
      var d = DIRS[state.dir]; var nx = state.x+d.dx, ny = state.y+d.dy;
      if (nx>=0 && ny>=0 && nx<ch.grid && ny<ch.grid && !ch.walls.some(function(w){ return w.x===nx&&w.y===ny; }))
        state = { x:nx, y:ny, dir:state.dir };
    }
    S.robot = state;
    var hit = ch.stars.findIndex(function(s){ return s.x===state.x && s.y===state.y; });
    if (hit>=0 && got.indexOf(hit)<0){ got.push(hit); S.collected = got.slice(); }
    drawGrid();
    await sleep(420);
  }

  var i = 0;
  outer: while (i < S.program.length){
    var b = S.program[i];
    if (b.type === "loopStart"){
      var j = i+1, depth = 1;
      while (j < S.program.length){
        if (S.program[j].type==="loopStart") depth++;
        if (S.program[j].type==="loopEnd"){ depth--; if (depth===0) break; }
        j++;
      }
      if (depth===0){
        var body = S.program.slice(i+1, j);
        for (var k=0; k<(b.count||2); k++)
          for (var m=0; m<body.length; m++) await runBlock(body[m]);
        i = j+1; continue outer;
      }
    }
    if (b.type !== "loopEnd") await runBlock(b);
    i++;
  }

  if (state.x===ch.goal.x && state.y===ch.goal.y && got.length===ch.stars.length){
    S.coderMsg = { ok:true, text:"🎉 Challenge complete in "+S.program.length+" blocks! Just like our Mega-makers class." };
    award(5, "Coding challenge complete! 🤖⭐");
  } else if (state.x===ch.goal.x && state.y===ch.goal.y){
    S.coderMsg = { ok:false, text:"You reached the flag, but missed some stars! ⭐ Try collecting ALL of them." };
  } else {
    S.coderMsg = { ok:false, text:"Hmm, the robot didn't reach the flag 🏁. Adjust your blocks and try again!" };
  }
  S.running = false;
  render();
}

    + '<div class="wire-row"><span class="big">🔋</span>'
    + '<svg width="180" height="40"><line x1="0" y1="20" x2="180" y2="20" stroke="'+(on?"#ff8c00":"#d1d5db")+'" stroke-width="5" stroke-linecap="round"/>'
    + (on?'<circle r="5" fill="#ff8c00"><animate attributeName="cx" values="0;180" dur="1.5s" repeatCount="indefinite"/></circle>':"")+'</svg>'
    + '<span class="big'+(on?"":" opacity:.5")+'">⚡</span></div>'
    + '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">'
    + '<button class="toggle'+(S.switchOn?" on-amber":"")+'" id="sw">'+(S.switchOn?"🔌 Switch: ON":"🔌 Switch: OFF")+'</button>'
    + '<button class="toggle'+(S.wire?" on-green":"")+'" id="wr">'+(S.wire?"🧵 Wire: Connected":"🧵 Wire: Loose")+'</button></div>'
    + (on?'<div class="success-box">🎉 Circuit complete! Electricity flows in a LOOP and the bulb shines!</div>':"")
    + '</div><div class="info-grid">'
    + '<div class="info-card" style="background:#f0f9ff;border:2px solid #bae6fd"><h4 style="color:#0369a1;margin-bottom:6px">🔍 What\'s happening?</h4>Electrons flow from the battery\'s <b>−</b> side, through the wire, through the bulb (making it glow!), and back to <b>+</b>. It\'s a loop — break it anywhere and everything stops!</div>'
    + '<div class="info-card" style="background:#fff3e0;border:2px solid #ffd9a0"><h4 style="color:#b45309;margin-bottom:6px">🤔 Think about it</h4>What happens if the wire is connected but the switch is OFF?<br><button class="btn-primary" id="try-exp" style="margin-top:10px">Try it!</button></div>'
    + '</div></div>';
  var app = el("app"); app.innerHTML = html;
  el("sw").onclick = function(){ S.switchOn = !S.switchOn; render(); };
  el("wr").onclick = function(){ S.wire = !S.wire; render(); };
  var t = el("try-exp"); if (t) t.onclick = function(){ S.switchOn = false; S.wire = true; render(); award(1, "Great experimenting! 🔬"); };
}

/* ================= GAME ================= */
var G = { playing:false, score:0, lives:3, items:[], basket:50, tm1:null, tm2:null, _ten:false };

function renderGame(){
  var html = '<div class="page"><h2 class="page-title">🎮 Robot Catch</h2>'
    + '<p class="page-sub">Catch ⭐ stars and 🔋 batteries with your robot. Miss the good ones or catch a 🧱 and you lose a life!</p>'
    + '<div class="game-stats"><span>🏆 '+G.score+'</span><span>🥇 Best '+BEST.score+'</span><span>'+"❤️".repeat(Math.max(0,G.lives))+'</span></div>'
    + '<div id="game-area"><div id="basket" style="left:'+G.basket+'%;top:86%">🤖</div>'
    + (G.playing?"":'<div class="game-overlay"><div class="t">'+(G.lives<=0?("💥 Game over! Score: "+G.score):"🎮 Robot Catch")+'</div><button class="start" id="game-start">'+(G.lives<=0?"Play again!":"Start!")+'</button></div>')
    + '</div><p class="tiny-tip">Move your finger or mouse across the game area to steer 🤖.</p></div>';
  el("app").innerHTML = html;
  var area = el("game-area");
  function move(clientX){
    var r = area.getBoundingClientRect();
    var pct = ((clientX - r.left) / r.width) * 100;
    G.basket = Math.max(5, Math.min(95, pct));
    el("basket").style.left = G.basket + "%";
  }
  area.addEventListener("pointermove", function(e){ if (G.playing) move(e.clientX); });
  area.addEventListener("pointerdown", function(e){ if (G.playing) move(e.clientX); });
  var st = el("game-start"); if (st) st.onclick = startGame;
  drawItems();
}

function drawItems(){
  var area = el("game-area"); if (!area) return;
  area.querySelectorAll(".falling").forEach(function(f){ f.remove(); });
  G.items.forEach(function(it){
    var d = document.createElement("div"); d.className="falling";
    d.textContent = it.good ? it.kind : "🧱";
    d.style.left = it.x+"%"; d.style.top = it.y+"%";
    area.insertBefore(d, el("basket"));
  });
}

function startGame(){
  G.playing = true; G.score = 0; G.lives = 3; G.items = []; render();
  clearInterval(G.tm1); clearInterval(G.tm2);
  G.tm1 = setInterval(function(){
    G.items.push({ id:Math.random(), x: 10+Math.random()*80, y:-5, good: Math.random()>0.25, kind: Math.random()>0.5?"⭐":"🔋" });
  }, 900);
  G.tm2 = setInterval(function(){
    var next = [];
    for (var i=0; i<G.items.length; i++){
      var it = G.items[i]; var y = it.y + 4;
      if (y >= 88){
        var caught = Math.abs(it.x - G.basket) < 12;
        if (caught && it.good) G.score++;
        else if (caught && !it.good) G.lives--;
        else if (!caught && it.good) G.lives--;
        continue;
      }
      next.push({ x:it.x, y:y, good:it.good, kind:it.kind });
    }
    G.items = next;
    if (G.score > BEST.score) { BEST.score = G.score; save(); }
    if (G.score > 0 && G.score % 10 === 0 && !G._ten) { G._ten = true; award(2, "10 catches! ⭐⭐"); }
    if (G.score % 10 !== 0) G._ten = false;
    if (G.lives <= 0){ clearInterval(G.tm1); clearInterval(G.tm2); G.playing = false; }
    render();
  }, 300);
}

/* ================= ROUTER ================= */
function render(){
  renderTabs();
  el("star-count").textContent = S.stars;
  if (S.tab==="home") renderHome();
  else if (S.tab==="learn") renderLearn();
  else if (S.tab==="coder") renderCoder();
  else if (S.tab==="lab") renderLab();
  else if (S.tab==="game") renderGame();
}
load();
render();
</script>
