/* ================= BINARY BOTS (based on CS Unplugged's binary cards) ================= */
/* Robots roll along a conveyor carrying a number. Flip the dot cards (1, 2, 4, 8, 16...) so the
   dots add up to the front robot's number before it reaches the door. Each card is a bit:
   face up = 1 (LED on), face down = 0 (LED off). */

var BMODES = [
  { id:3, name:"🐣 Starter", sub:"3 cards · 1–7" },
  { id:4, name:"🤖 Robot",   sub:"4 cards · 1–15" },
  { id:5, name:"🚀 Expert",  sub:"5 cards · 1–31" },
  { id:6, name:"🧠 Genius",  sub:"6 cards · 1–63" }
];
var BB = { mode:4, state:"menu", bits:[], bots:[], score:0, lives:3, spawnIn:0, speed:28, hint:true,
           cv:null, cx:null, w:0, h:0, raf:0, last:0, t:0, parts:[], zaps:[], best:{}, msg:"" };
try { var _bb = JSON.parse(localStorage.getItem("miniMakersBinary")); if (_bb){ BB.best = _bb.best || {}; BB.hint = _bb.hint !== false; } } catch(e){}
function binSave(){ try { localStorage.setItem("miniMakersBinary", JSON.stringify({ best:BB.best, hint:BB.hint })); } catch(e){} }

function binValues(){ var v = []; for (var i = BB.mode - 1; i >= 0; i--) v.push(1 << i); return v; }   // e.g. [8,4,2,1]
function binTotal(){ var v = binValues(), s = 0; BB.bits.forEach(function(b, i){ if (b) s += v[i]; }); return s; }
function binTarget(){ var front = null; BB.bots.forEach(function(b){ if (!b.done && (!front || b.x > front.x)) front = b; }); return front; }

function renderBinary(){
  var modes = BMODES.map(function(m){ return '<button class="pl-chip'+(BB.mode===m.id?" on":"")+'" data-bm="'+m.id+'">'+m.name+' <small>'+m.sub+'</small></button>'; }).join("");
  el("app").innerHTML = '<div class="page"><h2 class="page-title">🔢 Binary Bots</h2>'
    + '<p class="page-sub">Each robot needs its number made in <b>binary</b>. Flip the dot cards so the dots add up to the number on the front robot — before it reaches the door!</p>'
    + '<div class="pl-row">'+modes+'</div>'
    + '<div class="game-stats"><span id="bb-score">🏆 '+BB.score+'</span><span id="bb-lives">'+binLives()+'</span><span id="bb-best">🥇 Best '+(BB.best[BB.mode]||0)+'</span>'
    + '<label class="bb-hint"><input type="checkbox" id="bb-hint"'+(BB.hint?" checked":"")+'> 💡 Hints</label>'
    + '<span id="bb-mute" style="cursor:pointer;margin-left:auto">'+(G.muted?"🔇":"🔊")+'</span></div>'
    + '<div id="bb-area"><canvas id="bb-canvas" style="display:block;width:100%;height:100%"></canvas><div id="bb-ov"></div></div>'
    + '<div class="bb-sum" id="bb-sum"></div>'
    + '<div class="bb-cards" id="bb-cards"></div>'
    + '<p class="tiny-tip">Tip: start with the BIGGEST card. If it isn\'t bigger than the number, flip it up, then move to the next one.</p></div>';
  BB.cv = el("bb-canvas"); BB.cx = BB.cv.getContext("2d"); binSize();
  document.querySelectorAll("[data-bm]").forEach(function(b){ b.onclick = function(){ if (BB.state === "play") return; BB.mode = +b.getAttribute("data-bm"); BB.state = "menu"; BB.score = 0; render(); }; });
  el("bb-hint").onchange = function(){ BB.hint = this.checked; binSave(); binCards(); };
  el("bb-mute").onclick = function(){ G.muted = !G.muted; this.textContent = G.muted ? "🔇" : "🔊"; };
  if (BB.bits.length !== BB.mode) BB.bits = new Array(BB.mode).fill(0);
  binCards(); if (BB.state !== "play") binOverlay();
  if (!BB.raf){ BB.last = performance.now(); BB.raf = requestAnimationFrame(binLoop); }
}
function binLives(){ return "🔋".repeat(Math.max(0, BB.lives)) + "🪫".repeat(Math.max(0, 3 - BB.lives)); }
function binSize(){
  var r = BB.cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  BB.w = r.width; BB.h = r.height; BB.cv.width = Math.round(r.width*dpr); BB.cv.height = Math.round(r.height*dpr); BB.cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", function(){ if (S.tab === "binary" && BB.cv) binSize(); });
window.addEventListener("keydown", function(e){
  if (S.tab !== "binary" || BB.state !== "play") return;
  var n = parseInt(e.key, 10); if (n >= 1 && n <= BB.mode){ binFlip(n - 1); e.preventDefault(); }
});

/* which card would the hint suggest next? (greedy: biggest first) */
function binHintIdx(){
  var t = binTarget(); if (!t) return -1;
  var v = binValues(), rest = t.n;
  for (var i = 0; i < v.length; i++){ var want = rest >= v[i] ? 1 : 0; if (want) rest -= v[i]; if (BB.bits[i] !== want) return i; }
  return -1;
}
function binCards(){
  var box = el("bb-cards"); if (!box) return;
  var v = binValues(), hi = (BB.hint && BB.state === "play") ? binHintIdx() : -1;
  box.style.gridTemplateColumns = "repeat(" + BB.mode + ", 1fr)";
  box.innerHTML = v.map(function(val, i){
    var dots = ""; var cols = val >= 16 ? 8 : (val >= 4 ? 4 : val), ds = BB.mode >= 6 ? 4 : (BB.mode === 5 ? 5 : 8);
    for (var d = 0; d < val; d++) dots += '<i style="width:'+ds+'px;height:'+ds+'px"></i>';
    return '<button class="bcard'+(BB.bits[i]?" up":"")+(i===hi?" hint":"")+'" data-bc="'+i+'">'
      + '<span class="bled'+(BB.bits[i]?" on":"")+'"></span>'
      + '<span class="bdots" style="grid-template-columns:repeat('+Math.min(cols,8)+','+ds+'px);gap:'+(ds>6?3:2)+'px">'+(BB.bits[i]?dots:"")+'</span>'
      + '<span class="bval">'+val+'</span><span class="bbit">'+(BB.bits[i]?1:0)+'</span></button>';
  }).join("");
  document.querySelectorAll("[data-bc]").forEach(function(b){ b.onclick = function(){ binFlip(+b.getAttribute("data-bc")); }; });
  var t = binTarget(), sum = binTotal();
  el("bb-sum").innerHTML = '<span class="bs-bin">'+BB.bits.join("")+'</span><span class="bs-eq">= '+sum+'</span>'
    + (t ? '<span class="bs-need">robot needs <b>'+t.n+'</b></span>' : '');
}
function binFlip(i){
  if (BB.state !== "play") return;
  BB.bits[i] = BB.bits[i] ? 0 : 1;
  var a = SFX.ctx && SFX.ctx();
  if (a){ var o = a.createOscillator(), g = a.createGain(), tt = a.currentTime; o.type = "square"; o.frequency.setValueAtTime(BB.bits[i] ? 660 + i*40 : 330, tt);
    g.gain.setValueAtTime(0.05, tt); g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.07); o.connect(g); g.connect(a.destination); o.start(tt); o.stop(tt + 0.08); }
  binCheck(); binCards();
}
function binCheck(){
  var t = binTarget(); if (!t) return;
  if (binTotal() === t.n){
    t.done = true; t.zap = 0.6; BB.score++; SFX.star();
    BB.zaps.push({ x:t.x, y:t.y, life:0.5 });
    for (var k = 0; k < 24; k++) BB.parts.push({ x:t.x, y:t.y - 20, vx:(Math.random()-0.5)*220, vy:-Math.random()*200, g:320, life:1, c:["#facc15","#22d3ee","#a3e635"][k%3], r:3 });
    if (BB.score > (BB.best[BB.mode] || 0)){ BB.best[BB.mode] = BB.score; binSave(); }
    if (BB.score % 10 === 0){ SFX.fanfare(); award(2, "10 robots powered up! ⚡"); }
    var s = el("bb-score"), b = el("bb-best"); if (s) s.textContent = "🏆 " + BB.score; if (b) b.textContent = "🥇 Best " + (BB.best[BB.mode] || 0);
    setTimeout(function(){ BB.bits = BB.bits.map(function(){ return 0; }); binCards(); }, 250);
  }
}
function binNewNumber(){
  var max = (1 << BB.mode) - 1, n, last = BB.bots.length ? BB.bots[BB.bots.length-1].n : -1;
  do { n = 1 + Math.floor(Math.random() * max); } while (n === last);
  return n;
}
function binStart(){
  BB.state = "play"; BB.score = 0; BB.lives = 3; BB.bots = []; BB.parts = []; BB.zaps = [];
  BB.speed = 22 + BB.mode * 2; BB.spawnIn = 0; BB.bits = new Array(BB.mode).fill(0);
  var ov = el("bb-ov"); if (ov) ov.innerHTML = "";
  var l = el("bb-lives"); if (l) l.textContent = binLives(); var s = el("bb-score"); if (s) s.textContent = "🏆 0";
  SFX.start(); binCards();
}
function binOverlay(over){
  var ov = el("bb-ov"); if (!ov) return;
  var m = BMODES.filter(function(x){ return x.id === BB.mode; })[0];
  var body = over
    ? '<div class="t">🏭 Factory closed! You powered '+BB.score+' robots.</div><div class="ld-fact">💡 Computers store EVERYTHING — numbers, letters, pictures, music — as 1s and 0s like your cards. Each card is one <b>bit</b>. 8 bits make a <b>byte</b>!</div><button class="start" id="bb-go">Play again</button>'
    : '<div class="t">🔢 Binary Bots — '+m.name+'</div><div class="ld-sub">Cards: '+binValues().join(" · ")+'</div><button class="start" id="bb-go">Start!</button>';
  ov.innerHTML = '<div class="game-overlay">'+body+'</div>';
  el("bb-go").onclick = binStart;
}

function binLoop(now){
  if (!BB.cv || !document.body.contains(BB.cv)){ BB.raf = 0; return; }
  var dt = Math.min(0.05, (now - BB.last) / 1000); BB.last = now; BB.t += dt;
  if (BB.state === "play") binUpdate(dt);
  for (var i = BB.parts.length - 1; i >= 0; i--){ var p = BB.parts[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.g*dt; p.life -= dt*1.5; if (p.life <= 0) BB.parts.splice(i, 1); }
  for (var z = BB.zaps.length - 1; z >= 0; z--){ BB.zaps[z].life -= dt; if (BB.zaps[z].life <= 0) BB.zaps.splice(z, 1); }
  binDraw();
  BB.raf = requestAnimationFrame(binLoop);
}
function binUpdate(dt){
  var door = BB.w - 46, gap = 92;
  // time for a robot to reach the door: more cards = more thinking time; gets faster as you score
  var travel = Math.max(6, (7 + BB.mode * 1.8) - BB.score * 0.3);
  BB.speed = (door + 30) / travel;
  BB.spawnIn -= dt;
  var lastX = BB.bots.length ? Math.min.apply(null, BB.bots.map(function(b){ return b.x; })) : 999;
  if (BB.spawnIn <= 0 && lastX > gap - 20){
    BB.bots.push({ n:binNewNumber(), x:-30, y:0, done:false, zap:0, hue:Math.floor(Math.random()*6), wob:Math.random()*6 });
    BB.spawnIn = Math.max(1.8, travel * 0.33);
  }
  var hadTarget = binTarget();
  for (var i = BB.bots.length - 1; i >= 0; i--){
    var b = BB.bots[i];
    if (b.done){ b.zap -= dt; b.x += 220 * dt; if (b.x > BB.w + 40) BB.bots.splice(i, 1); continue; }
    b.x += BB.speed * dt;
    if (b.x >= door){
      BB.bots.splice(i, 1); BB.lives--; SFX.miss();
      for (var k = 0; k < 14; k++) BB.parts.push({ x:door, y:BB.h*0.55, vx:(Math.random()-0.5)*140, vy:-Math.random()*140, g:300, life:1, c:"#94a3b8", r:3 });
      var l = el("bb-lives"); if (l) l.textContent = binLives();
      BB.bits = BB.bits.map(function(){ return 0; });
      if (BB.lives <= 0){ BB.state = "over"; SFX.over(); binOverlay(true); binCards(); return; }
    }
  }
  if (binTarget() !== hadTarget) binCards();
}

var BOT_COLORS = ["#f97316","#22c55e","#3b82f6","#a855f7","#ec4899","#14b8a6"];
function binDraw(){
  var c = BB.cx, w = BB.w, h = BB.h, beltY = h * 0.72, door = w - 46;
  var g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#e0f2fe"); g.addColorStop(1, "#f1f5f9");
  c.fillStyle = g; c.fillRect(0, 0, w, h);

  c.lineWidth = 5; c.beginPath(); c.moveTo(0, 40); c.lineTo(w*0.6, 40); c.stroke();
  // conveyor belt
  c.fillStyle = "#334155"; rr(c, 0, beltY, w, 18, 9); c.fill();
  c.fillStyle = "#64748b"; var off = (BB.t * (BB.state === "play" ? BB.speed : 10)) % 24;
  for (var x = -24 + off; x < w; x += 24){ c.fillRect(x, beltY + 7, 12, 4); }
  for (var r = 0; r < w; r += 48){ c.fillStyle = "#1e293b"; c.beginPath(); c.arc(r + 12, beltY + 9, 6, 0, 6.28); c.fill(); }
  // door (charging station)
  c.fillStyle = "#1e293b"; rr(c, door, beltY - 92, 44, 110, 8); c.fill();
  c.fillStyle = BB.lives > 0 ? "#22c55e" : "#ef4444"; c.beginPath(); c.arc(door + 22, beltY - 76, 6, 0, 6.28); c.fill();
  c.fillStyle = "#facc15"; c.font = "900 18px Arial"; c.textAlign = "center"; c.fillText("⚡", door + 22, beltY - 40);
  // robots
  BB.bots.forEach(function(b){ drawBinBot(c, b, beltY, b === binTarget()); });

    c.strokeStyle = "rgba(250,204,21," + (z.life*2) + ")"; c.lineWidth = 3; c.beginPath();
    var yy = 0; c.moveTo(z.x, 0); for (var s = 1; s <= 6; s++){ yy = (beltY - 40) * s / 6; c.lineTo(z.x + (Math.random()-0.5)*18, yy); } c.stroke();
  });
  BB.parts.forEach(function(p){ c.globalAlpha = Math.max(0, p.life); c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.28); c.fill(); });
  c.globalAlpha = 1;
  if (BB.state === "menu"){ drawBinBot(c, { n:binValues().reduce(function(a, b){ return a + b; }, 0), x:w*0.5, done:false, zap:0, hue:0, wob:0 }, beltY, true); }
}
function drawBinBot(c, b, beltY, isTarget){
  var x = b.x, y = beltY, bob = Math.sin(BB.t * 8 + b.wob) * 1.5, col = BOT_COLORS[b.hue];
  c.save(); c.translate(x, y + bob);
  if (isTarget && !b.done){ c.fillStyle = "rgba(250,204,21,.28)"; c.beginPath(); c.ellipse(0, -30, 34, 44, 0, 0, 6.28); c.fill(); }
  // wheels
  c.fillStyle = "#111827"; c.beginPath(); c.arc(-11, -3, 6, 0, 6.28); c.arc(11, -3, 6, 0, 6.28); c.fill();
  // body
  c.fillStyle = b.done ? "#facc15" : col; rr(c, -18, -34, 36, 28, 6); c.fill();
  // screen showing the number
  c.fillStyle = "#0f172a"; rr(c, -14, -30, 28, 18, 4); c.fill();
  c.fillStyle = b.done ? "#a3e635" : "#22d3ee"; c.font = "900 " + (b.n > 9 ? 13 : 15) + "px Consolas, monospace"; c.textAlign = "center"; c.textBaseline = "middle";
  c.fillText(b.done ? "✓" : b.n, 0, -21); c.textBaseline = "alphabetic";
  // head
  c.fillStyle = "#e2e8f0"; rr(c, -12, -54, 24, 18, 6); c.fill();
  var happy = b.done;
  c.fillStyle = "#0f172a"; c.beginPath(); c.arc(-5, -46, 2.4, 0, 6.28); c.arc(5, -46, 2.4, 0, 6.28); c.fill();
  c.strokeStyle = "#0f172a"; c.lineWidth = 1.6; c.beginPath();
  if (happy) c.arc(0, -43, 4, 0.2, Math.PI - 0.2); else { c.moveTo(-3, -40); c.lineTo(3, -40); }
  c.stroke();

  c.strokeStyle = "#64748b"; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -54); c.lineTo(0, -62); c.stroke();
  c.fillStyle = happy ? "#facc15" : (isTarget ? "#ef4444" : "#94a3b8"); c.beginPath(); c.arc(0, -64, 3.2, 0, 6.28); c.fill();

/* ================= ROBOT LAUNCH (projectile physics) ================= */
/* Set the angle and power, launch a battery to a robot. Uses the real projectile equations:
     x = x0 + v·cos(θ)·t      y = y0 + v·sin(θ)·t − ½·g·t²
   Every 3 levels the game moves Earth → Moon → Mars. The launcher's top speed never changes,
   so on the Moon the same throw really does fly about 6× further. */

var LWORLDS = [
  { id:"earth", name:"Earth", emoji:"🌍", g:9.8,  sky:["#7dd3fc","#e0f2fe"], ground:"#16a34a", dirt:"#a16207" },
  { id:"moon",  name:"Moon",  emoji:"🌙", g:1.62, sky:["#020617","#1e1b4b"], ground:"#9ca3af", dirt:"#6b7280" },
  { id:"mars",  name:"Mars",  emoji:"🔴", g:3.71, sky:["#7c2d12","#fdba74"], ground:"#c2410c", dirt:"#7c2d12" }
];
var LV_MAX = 18;          // launcher top speed in m/s (same everywhere)
var LTYPES = ["flat", "platform", "wall"];
var LN = { level:1, state:"menu", angle:45, power:60, tries:0, score:0, stars:0, shots:[], cur:null, layout:null,
           cv:null, cx:null, w:0, h:0, raf:0, last:0, t:0, parts:[], msg:"", best:0, maxLevel:1, showEq:false, hitAnim:0 };
try { var _ln = JSON.parse(localStorage.getItem("miniMakersLaunch")); if (_ln){ LN.best = _ln.best || 0; LN.maxLevel = _ln.maxLevel || 1; } } catch(e){}
function launchSave(){ try { localStorage.setItem("miniMakersLaunch", JSON.stringify({ best:LN.best, maxLevel:LN.maxLevel })); } catch(e){} }

function lWorld(level){ return LWORLDS[Math.floor((level - 1) / 3) % 3]; }
function lType(level){ return level <= 9 ? LTYPES[(level - 1) % 3] : LTYPES[Math.floor(Math.random() * 3)]; }
function lRange(world){ return LV_MAX * LV_MAX / world.g; }     // the furthest a 45° throw can go on flat ground

/* ---------- Level layout (all in metres), checked so it can always be solved ---------- */
function lMakeLayout(level){
  var world = lWorld(level), R = lRange(world), W = R * 1.18, type = lType(level), L, tries = 0;
  do {
    var tx = W * (0.42 + Math.random() * 0.28);
    L = { world:world, type:type, W:W, x0:W * 0.04, y0:W * 0.025, rects:[], target:{ x:tx, base:0 }, hitR:W * 0.045 };
    if (type === "platform" || (type === "wall" && Math.random() < 0.5)){
      var ph = W * (0.05 + Math.random() * 0.06), pw = W * 0.11;
      L.rects.push({ x:tx - pw/2, w:pw, h:ph, kind:"platform" }); L.target.base = ph;
    }
    if (type === "wall"){
      var wx = W * (0.24 + Math.random() * 0.12), wh = W * (0.12 + Math.random() * 0.10);
      if (wx + W * 0.03 < tx - W * 0.08) L.rects.push({ x:wx, w:W * 0.025, h:wh, kind:"wall" });
    }
    tries++;
  } while (!lSolvable(L) && tries < 60);
  return L;
}
function lSolvable(L){
  for (var a = 10; a <= 80; a += 2) for (var p = 20; p <= 100; p += 2){ if (lSimulate(L, a, p).hit) return true; }
  return false;
}

/* ---------- Physics: step along the real equations and find what the battery hits ---------- */
function lSimulate(L, angle, power){
  var g = L.world.g, v = LV_MAX * power / 100, th = angle * Math.PI / 180;
  var vx = v * Math.cos(th), vy = v * Math.sin(th);
  var Tmax = (vy + Math.sqrt(vy*vy + 2*g*L.y0)) / g + 0.01, steps = 600, dt = Tmax / steps;
  var pts = [], maxH = 0, res = { hit:false, kind:"ground", x:0, t:0 };
  var tg = L.target, robotY = tg.base + L.hitR * 0.9;
  for (var i = 0; i <= steps; i++){
    var t = i * dt, x = L.x0 + vx * t, y = L.y0 + vy * t - 0.5 * g * t * t;
    pts.push({ x:x, y:y, t:t }); if (y > maxH) maxH = y;
    if (i === 0) continue;
    if (Math.hypot(x - tg.x, y - robotY) < L.hitR){ res = { hit:true, kind:"robot", x:x, y:y, t:t }; break; }
    var hitRect = null;
    for (var r = 0; r < L.rects.length; r++){ var R = L.rects[r]; if (x >= R.x && x <= R.x + R.w && y <= R.h && y >= 0){ hitRect = R; break; } }
    if (hitRect){
      var prev = pts[pts.length - 2], onTop = prev.y >= hitRect.h - 0.0001;
      res = { hit:false, kind:onTop ? "top" : hitRect.kind, x:x, y:onTop ? hitRect.h : y, t:t, rect:hitRect }; if (onTop) pts[pts.length-1].y = hitRect.h; break;
    }
    if (y <= 0){ var py = pts[pts.length-2]; var f = py.y / (py.y - y); var gx = py.x + (x - py.x) * f;
      pts[pts.length-1] = { x:gx, y:0, t:py.t + (t - py.t) * f }; res = { hit:false, kind:"ground", x:gx, y:0, t:pts[pts.length-1].t }; break; }
    if (x > L.W * 1.6){ res = { hit:false, kind:"off", x:x, y:y, t:t }; break; }
  }
  res.pts = pts; res.maxH = maxH; res.v = v; res.range = res.x - L.x0;
  return res;
}

/* ---------- Page ---------- */

  el("ln-fire").onclick = lFire;
  el("ln-eq-box").ontoggle = function(){ LN.showEq = this.open; };
  var wasMenu = LN.state === "menu" || LN.state === "menu-wait";
  if (!LN.layout || LN.state === "menu") lStartLevel(LN.level, true);

}
function launchSize(){ var r = LN.cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  LN.w = r.width; LN.h = r.height; LN.cv.width = Math.round(r.width*dpr); LN.cv.height = Math.round(r.height*dpr); LN.cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
window.addEventListener("resize", function(){ if (S.tab === "launch" && LN.cv) launchSize(); });
window.addEventListener("keydown", function(e){

});
function lCtrlUi(){

}

  el("ln-score").textContent = "🏆 " + LN.score;

}
function lEq(){

function lStartLevel(level, quiet){

function lFire(){
  if (LN.state !== "aim") return;
  var r = lSimulate(LN.layout, LN.angle, LN.power);
  var real = r.t, disp = Math.max(1.0, Math.min(2.6, real));
  LN.cur = { res:r, angle:LN.angle, power:LN.power, clock:0, speed:real / disp, done:false };
  LN.tries++; LN.state = "fly"; lHud(); lCtrlUi(); lMsg("", "");
  var a = SFX.ctx && SFX.ctx();
  if (a){ var o = a.createOscillator(), gg = a.createGain(), tt = a.currentTime; o.type = "triangle"; o.frequency.setValueAtTime(180, tt); o.frequency.exponentialRampToValueAtTime(700, tt + 0.25);
    gg.gain.setValueAtTime(0.18, tt); gg.gain.exponentialRampToValueAtTime(0.0001, tt + 0.3); o.connect(gg); gg.connect(a.destination); o.start(tt); o.stop(tt + 0.32); }
}
function lLanded(){
  var c = LN.cur, r = c.res, L = LN.layout;
  c.done = true;
  c.stats = "Flew " + r.range.toFixed(1) + " m in " + r.t.toFixed(1) + " s, highest point " + r.maxH.toFixed(1) + " m (v = " + r.v.toFixed(1) + " m/s, θ = " + c.angle + "°).";
  LN.shots.push(c);
  if (r.hit){
    LN.state = "won"; LN.hitAnim = 1.2; var pts = 4 - LN.tries; LN.score += pts; LN.stars++;
    if (LN.score > LN.best) LN.best = LN.score;
    if (LN.level + 1 > LN.maxLevel) LN.maxLevel = LN.level + 1;
    launchSave(); SFX.fanfare(); award(1, "Robot charged!");
    for (var k = 0; k < 40; k++) LN.parts.push({ x:L.target.x, y:L.target.base + L.hitR, vx:(Math.random()-0.5)*L.W*0.5, vy:Math.random()*L.W*0.45, life:1.3, c:["#facc15","#22c55e","#38bdf8","#f472b6"][k%4] });
    lHud(); setTimeout(function(){ if (LN.state === "won") lOverlay("win"); }, 700);
    return;
  }
  var diff = r.x - L.target.x, txt;
  if (r.kind === "wall") txt = "🧱 Bonk! The battery hit the wall " + r.y.toFixed(1) + " m up. Try a <b>higher angle</b> or <b>more power</b> to get over it.";
  else if (r.kind === "platform") txt = "📦 It hit the side of the platform. Aim a little <b>higher</b>.";
  else if (r.kind === "off") txt = "🚀 Way too far — it flew off the screen! Use <b>less power</b>.";
  else txt = (diff < 0 ? "⬅️ <b>" + Math.abs(diff).toFixed(1) + " m short</b>." : "➡️ <b>" + diff.toFixed(1) + " m too far</b>.")
    + (r.kind === "top" ? " (It landed on the platform.)" : "") + (diff < 0 ? " Try a bit more power." : " Try a bit less power.");
  SFX.miss();
  for (var j = 0; j < 12; j++) LN.parts.push({ x:r.x, y:r.y, vx:(Math.random()-0.5)*L.W*0.15, vy:Math.random()*L.W*0.12, life:0.8, c:"#a8a29e" });
  if (LN.tries >= 3){ LN.state = "failed"; lMsg(txt, "warn"); setTimeout(function(){ if (LN.state === "failed") lOverlay("fail"); }, 900); }
  else { LN.state = "aim"; lMsg(txt + " <span class='ln-left'>" + (3 - LN.tries) + " tr" + (3 - LN.tries === 1 ? "y" : "ies") + " left.</span>", "warn"); }
  lHud(); lCtrlUi();
}

function launchLoop(now){
  if (!LN.cv || !document.body.contains(LN.cv)){ LN.raf = 0; return; }
  var dt = Math.min(0.05, (now - LN.last) / 1000); LN.last = now; LN.t += dt;
  if (LN.state === "fly" && LN.cur && !LN.cur.done){
    LN.cur.clock += dt * LN.cur.speed;
    if (LN.cur.clock >= LN.cur.res.t){ LN.cur.clock = LN.cur.res.t; lLanded(); }
  }
  if (LN.hitAnim > 0) LN.hitAnim -= dt;
  var g = LN.layout ? LN.layout.world.g : 9.8, L = LN.layout;
  for (var i = LN.parts.length - 1; i >= 0; i--){ var p = LN.parts[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.vy -= (L ? L.W : 30) * 0.8 * dt; p.life -= dt; if (p.life <= 0) LN.parts.splice(i, 1); }
  launchDraw();
  LN.raf = requestAnimationFrame(launchLoop);
}

/* ---------- Drawing ---------- */
function launchDraw(){
  var c = LN.cx, w = LN.w, h = LN.h, L = LN.layout; if (!L) return;
  var wd = L.world, gy = h - 34, sc = (w - 10) / L.W;      // metres → pixels
  function X(m){ return 6 + m * sc; } function Y(m){ return gy - m * sc; }
  var g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, wd.sky[0]); g.addColorStop(1, wd.sky[1]);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  if (wd.id !== "earth"){ for (var s = 0; s < 40; s++){ c.fillStyle = "rgba(255,255,255," + (0.3 + 0.3*Math.sin(LN.t + s)) + ")"; c.fillRect((s * 97) % w, (s * 53) % (gy - 40), 1.5, 1.5); } }
  if (wd.id === "earth"){ c.fillStyle = "#fde047"; c.beginPath(); c.arc(w - 40, 34, 16, 0, 6.28); c.fill(); }
  // ground + ruler
  c.fillStyle = wd.ground; c.fillRect(0, gy, w, 8); c.fillStyle = wd.dirt; c.fillRect(0, gy + 8, w, h - gy);
  var step = niceStep(L.W / 6);
  c.fillStyle = "rgba(255,255,255,.85)"; c.font = "700 10px Poppins, Arial"; c.textAlign = "center";
  for (var m = 0; m <= L.W; m += step){ var px = X(L.x0 + m); if (px > w - 8) break; c.fillRect(px, gy + 8, 1.5, 6); c.fillText(m + " m", px, gy + 25); }
  // platforms and walls
  L.rects.forEach(function(R){
    if (R.kind === "wall"){ c.fillStyle = "#78716c"; c.fillRect(X(R.x), Y(R.h), R.w * sc, R.h * sc);
      c.strokeStyle = "#57534e"; c.lineWidth = 1; for (var by = 0; by < R.h * sc; by += 8){ c.beginPath(); c.moveTo(X(R.x), Y(R.h) + by); c.lineTo(X(R.x) + R.w*sc, Y(R.h) + by); c.stroke(); } }
    else { c.fillStyle = "#94a3b8"; c.fillRect(X(R.x), Y(R.h), R.w * sc, R.h * sc); c.fillStyle = "#475569"; c.fillRect(X(R.x), Y(R.h), R.w * sc, 5);
      c.strokeStyle = "#64748b"; c.lineWidth = 2; c.beginPath(); c.moveTo(X(R.x), Y(R.h)); c.lineTo(X(R.x + R.w), gy); c.moveTo(X(R.x + R.w), Y(R.h)); c.lineTo(X(R.x), gy); c.stroke(); }
  });
  // earlier shots: faint dotted lines
  LN.shots.forEach(function(sh, i){
    if (sh === LN.cur && !sh.done) return;
    c.setLineDash([3, 6]); c.strokeStyle = "rgba(255,255,255,.55)"; c.lineWidth = 2; c.beginPath();
    sh.res.pts.forEach(function(p, k){ if (k === 0) c.moveTo(X(p.x), Y(p.y)); else c.lineTo(X(p.x), Y(p.y)); }); c.stroke(); c.setLineDash([]);
    var e = sh.res.pts[sh.res.pts.length - 1]; c.fillStyle = "rgba(255,255,255,.8)"; c.font = "800 10px Arial"; c.textAlign = "center";
    c.fillText((i + 1) + ": " + sh.angle + "°/" + sh.power + "%", X(e.x), Y(e.y) - 8);
  });
  // target robot
  drawLaunchBot(c, X(L.target.x), Y(L.target.base), L.hitR * sc, LN.state === "won");
  // launcher
  var lx = X(L.x0), ly = Y(L.y0), ang = LN.angle * Math.PI / 180;
  c.fillStyle = "#334155"; rr(c, lx - 14, ly, 28, gy - ly + 2, 4); c.fill();
  c.save(); c.translate(lx, ly); c.rotate(-ang);
  c.fillStyle = "#f97316"; rr(c, -4, -7, 40, 14, 6); c.fill(); c.fillStyle = "#c2410c"; c.fillRect(30, -7, 6, 14);
  c.restore();
  c.fillStyle = "#1e293b"; c.beginPath(); c.arc(lx, ly, 8, 0, 6.28); c.fill();
  // power arrow while aiming
  if (LN.state === "aim"){
    var len = 30 + LN.power * 0.6; c.strokeStyle = "rgba(250,204,21,.9)"; c.lineWidth = 3; c.setLineDash([6, 4]);
    c.beginPath(); c.moveTo(lx, ly); c.lineTo(lx + Math.cos(ang) * len, ly - Math.sin(ang) * len); c.stroke(); c.setLineDash([]);
    c.fillStyle = "#fde047"; c.font = "800 11px Arial"; c.textAlign = "left"; c.fillText(LN.angle + "°", lx + 22, ly - 6);
  }
  // current flight
  if (LN.cur && (LN.state === "fly" || !LN.cur.done)){
    var pts = LN.cur.res.pts, tt = LN.cur.clock, last = pts[0];
    c.strokeStyle = "#fde047"; c.lineWidth = 2.5; c.beginPath(); c.moveTo(X(pts[0].x), Y(pts[0].y));
    for (var k = 1; k < pts.length && pts[k].t <= tt; k++){ c.lineTo(X(pts[k].x), Y(pts[k].y)); last = pts[k]; } c.stroke();
    drawBatt(c, X(last.x), Y(last.y), tt * 8);
    if (Y(last.y) < 4){ c.fillStyle = "#fff"; c.font = "800 11px Arial"; c.textAlign = "center"; c.fillText("▲ " + last.y.toFixed(0) + " m up", X(last.x), 14); }
    if (LN.cur.speed > 1.3){ c.fillStyle = "rgba(255,255,255,.85)"; c.font = "800 11px Arial"; c.textAlign = "right"; c.fillText("⏩ ×" + LN.cur.speed.toFixed(0) + " speed", w - 10, 18); }
  }
  LN.parts.forEach(function(p){ c.globalAlpha = Math.max(0, Math.min(1, p.life)); c.fillStyle = p.c; c.beginPath(); c.arc(X(p.x), Y(p.y), 3, 0, 6.28); c.fill(); });
  c.globalAlpha = 1;
  // planet + gravity badge
  c.fillStyle = "rgba(0,0,0,.35)"; rr(c, 8, 8, 128, 24, 8); c.fill();
  c.fillStyle = "#fff"; c.font = "800 11px Poppins, Arial"; c.textAlign = "left"; c.fillText(wd.emoji + " " + wd.name + "  g = " + wd.g + " m/s²", 14, 24);
}
function niceStep(x){ var p = Math.pow(10, Math.floor(Math.log10(x))), n = x / p; return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p; }
function drawBatt(c, x, y, rot){
  c.save(); c.translate(x, y); c.rotate(rot);
  c.fillStyle = "#1f2937"; rr(c, -9, -5, 16, 10, 2); c.fill(); c.fillStyle = "#facc15"; c.fillRect(1, -5, 6, 10);
  c.fillStyle = "#9ca3af"; c.fillRect(7, -2.5, 3, 5); c.restore();
}
function drawLaunchBot(c, x, y, r, happy){
  var s = Math.max(0.6, r / 16), bob = happy ? Math.abs(Math.sin(LN.t * 10)) * 4 : Math.sin(LN.t * 3) * 1.5;
  c.save(); c.translate(x, y - bob); c.scale(s, s);
  // catch zone
  c.strokeStyle = "rgba(250,204,21,.6)"; c.setLineDash([3, 3]); c.lineWidth = 1.5; c.beginPath(); c.arc(0, -14.4, 16, 0, 6.28); c.stroke(); c.setLineDash([]);
  c.fillStyle = "#111827"; c.fillRect(-9, -4, 6, 4); c.fillRect(3, -4, 6, 4);
  c.fillStyle = happy ? "#facc15" : "#3b82f6"; rr(c, -10, -22, 20, 18, 4); c.fill();
  // battery gauge on chest
  c.fillStyle = "#0f172a"; rr(c, -6, -18, 12, 8, 2); c.fill();
  c.fillStyle = happy ? "#22c55e" : "#ef4444"; c.fillRect(-5, -17, happy ? 10 : 3, 6);
  // arms up to catch
  c.strokeStyle = "#475569"; c.lineWidth = 3; c.lineCap = "round"; c.beginPath(); c.moveTo(-10, -18); c.lineTo(-16, -28); c.moveTo(10, -18); c.lineTo(16, -28); c.stroke();
  c.fillStyle = "#e2e8f0"; rr(c, -8, -34, 16, 12, 4); c.fill();
  c.fillStyle = "#0f172a"; c.beginPath(); c.arc(-3.5, -29, 1.8, 0, 6.28); c.arc(3.5, -29, 1.8, 0, 6.28); c.fill();
  c.strokeStyle = "#0f172a"; c.lineWidth = 1.2; c.beginPath(); if (happy) c.arc(0, -27, 3, 0.2, Math.PI - 0.2); else c.arc(0, -24, 2.5, Math.PI + 0.3, -0.3); c.stroke();
  c.fillStyle = happy ? "#facc15" : "#ef4444"; c.beginPath(); c.arc(0, -38, 2.2, 0, 6.28); c.fill();
  c.restore();
}

/* ================= ROUTER ================= */
function render(){
  renderTabs();
  el("star-count").textContent = S.stars;
  if (S.tab==="home") renderHome();
  else if (S.tab==="learn") renderLearn();
  else if (S.tab==="coder") renderCoder();
  else if (S.tab==="lab") renderLab();
  else if (S.tab==="game") renderGame();
  else if (S.tab==="lander") renderLander();
  else if (S.tab==="binary") renderBinary();
  else if (S.tab==="launch") renderLaunch();
  else if (S.tab==="leds") renderLeds();
}
load();
if (location.hash === "#game") S.tab = "game";
if (location.hash === "#lab") S.tab = "lab";
if (location.hash === "#sim"){ S.tab = "lab"; L.view = "sim"; }
if (location.hash === "#guide"){ S.tab = "lab"; L.view = "guide"; }
if (location.hash === "#leds") S.tab = "leds";
if (location.hash === "#lander") S.tab = "lander";
if (location.hash === "#binary") S.tab = "binary";
if (location.hash === "#launch") S.tab = "launch";
render();
</script>
