  /* Dev notice banner */

var BLOCKS = { fwd:{label:"Move ⬆️"}, left:{label:"Turn ↰"}, right:{label:"Turn ↱"}, loopStart:{label:"Repeat ×"}, loopEnd:{label:"End repeat"} };
var DIRS = [{dx:0,dy:-1},{dx:1,dy:0},{dx:0,dy:1},{dx:-1,dy:0}];

    + '<p class="page-sub">Challenge '+(S.challenge+1)+': <b>'+ch.name+'</b> — '+ch.hint+'</p><div class="ch-pills">';
  CHALLENGES.forEach(function(c,i){ html += '<button class="pill'+(i===S.challenge?" active":"")+'" data-c="'+i+'">'+(i+1)+'. '+c.name+'</button>'; });
  html += '</div><div class="coder-grid-2"><div class="panel"><h3>🧩 Tap blocks to build your program:</h3><div class="palette">'
    + '<button class="blk-btn b-fwd" data-add="fwd">⬆️ Move</button>'
    + '<button class="blk-btn b-turn" data-add="left">↰ Turn left</button>'
    + '<button class="blk-btn b-turn" data-add="right">↱ Turn right</button>'
    + '<button class="blk-btn b-loop" data-add="loopStart">🔁 Repeat</button>'
    + '<button class="blk-btn b-loop" data-add="loopEnd">⏹ End repeat</button></div>'
    + '<h3>📝 Your program:</h3><div class="program" id="program">';
  if (S.program.length === 0) html += '<div class="empty">Tap blocks above to build your program…</div>';
  S.program.forEach(function(b,i){
    var t = BLOCKS[b.type];
    var bg = b.type==="fwd" ? "#0d9488" : (b.type==="loopStart"||b.type==="loopEnd") ? (b.type==="loopEnd"?"#ffd9a0":"#ff8c00") : "#0066cc";
    html += '<div class="blk-row">';
    if (b.type === "loopStart") html += '<input type="number" min="1" max="5" value="'+b.count+'" class="blk-count" data-cnt="'+i+'">';
    html += '<div class="blk'+(b.type==="loopEnd"?" end":"")+'" style="background:'+bg+'">'
      + '<span>'+t.label+'</span><button class="blk-del" data-del="'+i+'">×</button></div></div>';
  });
  html += '</div><div class="run-row"><button class="btn-run" id="run-btn" '+(S.running||S.program.length===0?"disabled":"")+'>'
    + (S.running?"▶ Running…":"▶ Run Program!")+'</button>'
    + '<button class="btn-clear" id="clear-btn">🗑️</button></div></div>'
    + '<div class="panel grid-wrap"><h3>🌍 Robot World</h3><div class="robot-grid" id="robot-grid" style="grid-template-columns:repeat('+ch.grid+', 52px)"></div>';
  if (S.coderMsg) html += '<div class="'+(S.coderMsg.ok?"msg-ok":"msg-no")+'">'+S.coderMsg.text+'</div>';
  html += '<p class="tiny-tip">🤖 arrow shows the direction. Turns rotate the robot in place.</p></div></div></div>';
  var app = el("app"); app.innerHTML = html;
  app.querySelectorAll("[data-c]").forEach(function(b){ b.onclick = function(){ var i=+b.getAttribute("data-c"); S.challenge=i; var c=CHALLENGES[i]; S.robot={x:c.start.x,y:c.start.y,dir:0}; S.program=[]; S.collected=[]; S.coderMsg=null; render(); }; });
  app.querySelectorAll("[data-add]").forEach(function(b){
    b.onclick = function(){
      if (S.running) return;
      var t = b.getAttribute("data-add");
      S.program.push(t==="loopStart" ? {type:t,count:2} : {type:t});
      S.coderMsg = null; render();
    };
  });
  app.querySelectorAll("[data-del]").forEach(function(b){ b.onclick = function(){ if(!S.running){ S.program.splice(+b.getAttribute("data-del"),1); render(); } }; });
  app.querySelectorAll("[data-cnt]").forEach(function(inp){
    inp.onchange = function(){ var i=+inp.getAttribute("data-cnt"); S.program[i].count = Math.max(1, Math.min(5, +inp.value||1)); render(); };
  });
  el("clear-btn").onclick = function(){ if(!S.running){ S.program=[]; S.robot={x:ch.start.x,y:ch.start.y,dir:0}; S.collected=[]; S.coderMsg=null; render(); } };
  el("run-btn").onclick = runProgram;
  drawGrid();
}

function drawGrid(){
  var ch = CHALLENGES[S.challenge]; var g = el("robot-grid"); if(!g) return;
  g.innerHTML = "";
  for (var y=0; y<ch.grid; y++){
    for (var x=0; x<ch.grid; x++){
      var c = document.createElement("div"); c.className = "cell"; c.style.width="52px"; c.style.height="52px";
      var isWall = ch.walls.some(function(w){ return w.x===x&&w.y===y; });
      var starIdx = ch.stars.findIndex(function(s){ return s.x===x&&s.y===y; });
      var hasStar = starIdx>=0 && S.collected.indexOf(starIdx)<0;
      var isGoal = ch.goal.x===x && ch.goal.y===y;
      var isRobot = S.robot.x===x && S.robot.y===y;
      if (isWall) c.textContent = "🧱";
      else if (hasStar) c.textContent = "⭐";
      else if (isGoal) c.textContent = "🏁";
      if (isRobot){
        var r = document.createElement("div"); r.className = "robot"; r.textContent = "🤖";
        r.style.transform = "rotate("+(S.robot.dir*90)+"deg)";
        c.appendChild(r);
      }
      g.appendChild(c);
    }
  }
}

function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

async function runProgram(){
  if (S.running || S.program.length===0) return;
  var ch = CHALLENGES[S.challenge];
  S.running = true; S.coderMsg = null; S.collected = [];
  S.robot = { x:ch.start.x, y:ch.start.y, dir:0 };
  render();
  await sleep(350);
  var state = S.robot, got = [];

  async function runBlock(b){
    if (b.type==="left") state = { x:state.x, y:state.y, dir:(state.dir+3)%4 };
    else if (b.type==="right") state = { x:state.x, y:state.y, dir:(state.dir+1)%4 };
    else if (b.type==="fwd"){
      var d = DIRS[state.dir]; var nx = state.x+d.dx, ny = state.y+d.dy;
      if (nx>=0 && ny>=0 && nx<ch.grid && ny<ch.grid && !ch.walls.some(function(w){ return w.x===nx&&w.y===ny; }))
        state = { x:nx, y:ny, dir:state.dir };
    }
    S.robot = state;
    var hit = ch.stars.findIndex(function(s){ return s.x===state.x && s.y===state.y; });
    if (hit>=0 && got.indexOf(hit)<0){ got.push(hit); S.collected = got.slice(); }
    drawGrid();
    await sleep(420);
  }

  var i = 0;
  outer: while (i < S.program.length){
    var b = S.program[i];
    if (b.type === "loopStart"){
      var j = i+1, depth = 1;
      while (j < S.program.length){
        if (S.program[j].type==="loopStart") depth++;
        if (S.program[j].type==="loopEnd"){ depth--; if (depth===0) break; }
        j++;
      }
      if (depth===0){
        var body = S.program.slice(i+1, j);
        for (var k=0; k<(b.count||2); k++)
          for (var m=0; m<body.length; m++) await runBlock(body[m]);
        i = j+1; continue outer;
      }
    }
    if (b.type !== "loopEnd") await runBlock(b);
    i++;
  }

  if (state.x===ch.goal.x && state.y===ch.goal.y && got.length===ch.stars.length){
    S.coderMsg = { ok:true, text:"🎉 Challenge complete in "+S.program.length+" blocks! Just like our Mega-makers class." };
    award(5, "Coding challenge complete! 🤖⭐");
  } else if (state.x===ch.goal.x && state.y===ch.goal.y){
    S.coderMsg = { ok:false, text:"You reached the flag, but missed some stars! ⭐ Try collecting ALL of them." };
  } else {
    S.coderMsg = { ok:false, text:"Hmm, the robot didn't reach the flag 🏁. Adjust your blocks and try again!" };
  }
  S.running = false;
  render();
}

/* ================= CIRCUIT LAB (v2: build-your-own circuits + real simulation) ================= */

/* ---------- Circuit solver (Modified nodal analysis, all parts as conductance + current source) ---------- */
function solveCircuit(comps, wires, over){
  over = over || {};
  var n = comps.length * 2, idx = {};
  comps.forEach(function(c, i){ idx[c.id] = i; });
  var night = over.night !== undefined ? over.night : L.night;
  var ledOn = comps.map(function(c){ return c.type === "led" ? (c.ledOn !== false) : false; });
  var out = [];
  for (var iter = 0; iter < 6; iter++){
    var els = [];   // {p, q, G, S, ci}   current p->q through element = G*(Vp-Vq) + S
    comps.forEach(function(c, i){
      var p = i*2, q = i*2 + 1, P = PARTS[c.type];
      if (c.type === "battery") els.push({ p:p, q:q, G:1/P.R, S:P.V/P.R, ci:i });              // term0 = −, term1 = +
      else if (c.type === "switch"){ var on = over.sw !== undefined ? over.sw : c.on; if (on) els.push({ p:p, q:q, G:20, S:0, ci:i }); }
      else if (c.type === "button"){ var pr = over.btn !== undefined ? over.btn : c.pressed; if (pr) els.push({ p:p, q:q, G:20, S:0, ci:i }); }
      else if (c.type === "sensor"){ if (night) els.push({ p:p, q:q, G:1/3, S:0, ci:i }); }
      else if (c.type === "led"){ if (!c.burnt && ledOn[i]) els.push({ p:q, q:p, G:1/P.R, S:-P.Vf/P.R, ci:i }); } // term1 = + (anode)
      else els.push({ p:p, q:q, G:1/P.R, S:0, ci:i });
    });
    wires.forEach(function(w){
      if (idx[w.a.c] === undefined || idx[w.b.c] === undefined) return;
      els.push({ p:idx[w.a.c]*2 + w.a.t, q:idx[w.b.c]*2 + w.b.t, G:100, S:0, wire:w });
    });
    // build matrix
    var A = [], b = [];
    for (var r = 0; r < n; r++){ A.push(new Array(n).fill(0)); A[r][r] = 1e-9; b.push(0); }
    els.forEach(function(e){
      A[e.p][e.p] += e.G; A[e.q][e.q] += e.G; A[e.p][e.q] -= e.G; A[e.q][e.p] -= e.G;
      b[e.p] -= e.S; b[e.q] += e.S;
    });
    var V = gauss(A, b);
    // currents
    var cur = comps.map(function(){ return 0; });
    els.forEach(function(e){
      e.I = e.G * (V[e.p] - V[e.q]) + e.S;
      if (e.ci !== undefined) cur[e.ci] = (comps[e.ci].type === "led") ? -e.I : e.I;  // store as term0 -> term1
      if (e.wire) e.wire._I = e.I;
    });
    // check LED guesses
    var changed = false;
    comps.forEach(function(c, i){
      if (c.type !== "led" || c.burnt) return;
      if (ledOn[i] && -cur[i] < 0){ ledOn[i] = false; changed = true; }
      else if (!ledOn[i] && (V[i*2+1] - V[i*2]) > PARTS.led.Vf){ ledOn[i] = true; changed = true; }
    });
    if (!changed || iter === 5){
      out = comps.map(function(c, i){
        var I = cur[i], a = Math.abs(I), o = { type:c.type, I:I, bright:0, on:false, speed:0, burnt:!!c.burnt, short:false, ledOn:ledOn[i] };
        if (c.type === "bulb"){ o.bright = (I*I*PARTS.bulb.R) / 1.28; o.on = o.bright > 0.15; }
        if (c.type === "buzzer") o.on = a > 0.03;
        if (c.type === "motor") o.speed = a / 0.35;
        if (c.type === "led"){ var li = -I; o.on = li > 0.003; o.bright = Math.min(1, li / 0.015); o.ledI = li; }
        if (c.type === "battery") o.short = a > 2.5;
        return o;
      });
      out.wireI = wires.map(function(w){ return w._I || 0; });
      return out;
    }
  }
  return out;
}
function gauss(A, b){
  var n = b.length;
  for (var c = 0; c < n; c++){
    var mx = c; for (var r = c+1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[mx][c])) mx = r;
    var t = A[c]; A[c] = A[mx]; A[mx] = t; var tb = b[c]; b[c] = b[mx]; b[mx] = tb;
    var piv = A[c][c]; if (Math.abs(piv) < 1e-15) continue;
    for (var r2 = c+1; r2 < n; r2++){
      var f = A[r2][c] / piv; if (!f) continue;
      for (var k = c; k < n; k++) A[r2][k] -= f * A[c][k];
      b[r2] -= f * b[c];
    }
  }
  var x = new Array(n).fill(0);
  for (var i = n-1; i >= 0; i--){
    var s = b[i]; for (var j = i+1; j < n; j++) s -= A[i][j] * x[j];
    x[i] = Math.abs(A[i][i]) < 1e-15 ? 0 : s / A[i][i];
  }
  return x;
}
function labResults(over){ return solveCircuit(L.comps, L.wires, over); }
function lit(x){ return x.bright > 0.15; }
function glowing(x){ return x.bright > 0.03; }
function countWhere(r, type, fn){ var n = 0; r.forEach(function(x){ if (x.type === type && fn(x)) n++; }); return n; }
function anyShort(r){ return r.some(function(x){ return x.short; }); }
function anyOn(type){ return L.comps.some(function(c){ return c.type === type && c.on; }); }

function labSetLevel(i){

function labSize(){
  if (!L.cv) return;
  var r = L.cv.parentNode.getBoundingClientRect();
  L.cols = r.width < 520 ? 5 : 7;
  L.cell = r.width / L.cols;
  L.rows = r.width < 520 ? 5 : 4;
  var h = L.cell * L.rows;
  L.cv.parentNode.style.height = h + "px";
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  L.w = r.width; L.h = h; L.cv.width = Math.round(r.width*dpr); L.cv.height = Math.round(h*dpr);
  L.cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // keep parts on the board if the size changed
  L.comps.forEach(function(c){ c.col = Math.min(c.col, L.cols-1); c.row = Math.min(c.row, L.rows-1); });
}
window.addEventListener("resize", function(){ if (S.tab === "lab" && L.view === "sim") labSize(); });

function used(type){ return L.comps.filter(function(c){ return c.type === type; }).length; }
function allowed(type){ var p = LEVELS[L.level].parts; return p ? (p[type] || 0) : 6; }

function labUi(){
  var pal = el("lab-pal"); if (!pal) return;
  pal.innerHTML = "";
  PART_ORDER.forEach(function(t){
    var max = allowed(t); if (!max) return;
    var left = max - used(t);
    var b = document.createElement("button"); b.className = "pal-btn"; b.disabled = left <= 0;
    b.innerHTML = '<span class="pe">'+PARTS[t].emoji+'</span><span>'+PARTS[t].name+'</span>'+(LEVELS[L.level].parts?'<span class="pc">×'+left+'</span>':'');
    b.onclick = function(){ labAdd(t); };
    pal.appendChild(b);
  });
  var hasSel = !!L.sel;
  el("lab-rot").disabled = !(hasSel && L.sel.kind === "comp");
  el("lab-del").disabled = !hasSel;
}

function cellFree(col, row, except){ return !L.comps.some(function(c){ return c !== except && c.col === col && c.row === row; }); }
function labAdd(type){
  if (used(type) >= allowed(type)) return;
  for (var r = 0; r < L.rows; r++) for (var c = 0; c < L.cols; c++){
    if (cellFree(c, r)){
      var comp = { id:L.nextId++, type:type, col:c, row:r, rot:0, on:false, pressed:false, burnt:false, ang:0 };
      L.comps.push(comp); L.sel = { kind:"comp", c:comp }; labUi(); labClick(); return;
    }
  }
  labStatus("full", "The board is full! Remove a part first.");
}
function labDelete(){
  if (!L.sel) return;
  if (L.sel.kind === "comp"){
    var id = L.sel.c.id;
    L.comps = L.comps.filter(function(c){ return c.id !== id; });
    L.wires = L.wires.filter(function(w){ return w.a.c !== id && w.b.c !== id; });
  } else L.wires = L.wires.filter(function(w){ return w !== L.sel.w; });
  L.sel = null; labUi();
}

/* ---------- Geometry ---------- */
function compCenter(c){
  if (L.drag && L.drag.kind === "comp" && L.drag.c === c && L.drag.moved) return { x:L.drag.x, y:L.drag.y };
  return { x:(c.col + 0.5) * L.cell, y:(c.row + 0.5) * L.cell };
}
function termPos(c, t){
  var ctr = compCenter(c), d = L.cell * 0.42, a = c.rot * Math.PI / 2, s = t === 0 ? -1 : 1;
  return { x:ctr.x + Math.cos(a) * d * s, y:ctr.y + Math.sin(a) * d * s };
}
function findComp(id){ for (var i = 0; i < L.comps.length; i++) if (L.comps[i].id === id) return L.comps[i]; return null; }
function wireCurve(w){
  var A = termPos(findComp(w.a.c), w.a.t), B = termPos(findComp(w.b.c), w.b.t);
  var d = Math.hypot(B.x - A.x, B.y - A.y);
  return { A:A, B:B, C:{ x:(A.x + B.x)/2, y:(A.y + B.y)/2 + 14 + d * 0.18 } };
}
function qpt(q, t){ var u = 1 - t; return { x:u*u*q.A.x + 2*u*t*q.C.x + t*t*q.B.x, y:u*u*q.A.y + 2*u*t*q.C.y + t*t*q.B.y }; }
function labPos(e){ var r = L.cv.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
function hitTerm(p){
  var best = null, bd = Math.max(16, L.cell * 0.22);
  L.comps.forEach(function(c){ [0,1].forEach(function(t){ var q = termPos(c, t), d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd){ bd = d; best = { c:c.id, t:t }; } }); });
  return best;
}
function hitComp(p){
  for (var i = L.comps.length - 1; i >= 0; i--){ var ctr = compCenter(L.comps[i]); if (Math.abs(ctr.x - p.x) < L.cell*0.36 && Math.abs(ctr.y - p.y) < L.cell*0.36) return L.comps[i]; }
  return null;
}
function hitWire(p){
  for (var i = L.wires.length - 1; i >= 0; i--){
    var q = wireCurve(L.wires[i]);
    for (var k = 0; k <= 20; k++){ var pt = qpt(q, k/20); if (Math.hypot(pt.x - p.x, pt.y - p.y) < 10) return L.wires[i]; }
  }
  return null;
}
function sameTerm(a, b){ return a && b && a.c === b.c && a.t === b.t; }
function addWire(a, b){
  if (sameTerm(a, b)) return;
  var dup = L.wires.some(function(w){ return (sameTerm(w.a, a) && sameTerm(w.b, b)) || (sameTerm(w.a, b) && sameTerm(w.b, a)); });
  if (dup || L.wires.length >= 40) return;
  L.wires.push({ a:a, b:b, color:WIRE_COLORS[L.wires.length % WIRE_COLORS.length] });
  labClick(); L.sel = null; labUi();
}

/* ---------- Touch / mouse ---------- */
function labDown(e){
  var p = labPos(e); L.cv.setPointerCapture(e.pointerId);
  var t = hitTerm(p);
  if (t){ L.drag = { kind:"wire", from:t, x:p.x, y:p.y, sx:p.x, sy:p.y }; return; }
  var c = hitComp(p);
  if (c){
    L.sel = { kind:"comp", c:c }; L.pending = null;
    L.drag = { kind:"comp", c:c, x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false };
    if (c.type === "button"){ c.pressed = true; labClick(); }
    labUi(); return;
  }
  var w = hitWire(p);
  if (w){ L.sel = { kind:"wire", w:w }; L.pending = null; labUi(); return; }
  L.sel = null; L.pending = null; labUi();
}
function labMove(e){
  if (!L.drag) return;
  var p = labPos(e); L.drag.x = p.x; L.drag.y = p.y;
  if (L.drag.kind === "comp" && !L.drag.moved && Math.hypot(p.x - L.drag.sx, p.y - L.drag.sy) > 10){
    L.drag.moved = true; L.drag.c.pressed = false;
  }
}
function labUp(e){
  var d = L.drag; L.drag = null; if (!d) return;
  var p = labPos(e);
  if (d.kind === "wire"){
    var t2 = hitTerm(p);
    var tapped = Math.hypot(p.x - d.sx, p.y - d.sy) < 8;
    if (t2 && !sameTerm(t2, d.from)) { addWire(d.from, t2); L.pending = null; }
    else if (tapped){
      if (L.pending && !sameTerm(L.pending, d.from)){ addWire(L.pending, d.from); L.pending = null; }
      else L.pending = sameTerm(L.pending, d.from) ? null : d.from;
    }
    return;
  }
  var c = d.c;
  if (d.moved){
    var col = Math.max(0, Math.min(L.cols - 1, Math.floor(p.x / L.cell)));
    var row = Math.max(0, Math.min(L.rows - 1, Math.floor(p.y / L.cell)));
    if (cellFree(col, row, c)){ c.col = col; c.row = row; }
    labClick();
  } else {
    if (c.type === "switch"){ c.on = !c.on; labClick(); }
    if (c.type === "led" && c.burnt){ c.burnt = false; labStatus("newled", "🔧 New LED fitted! This time add a resistor to protect it."); }
  }
  if (c.type === "button") c.pressed = false;
}

/* ---------- Sounds (made in code) ---------- */
function labClick(){ var a = SFX.ctx && SFX.ctx(); if (!a) return; var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = "square"; o.frequency.setValueAtTime(1800, t); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.04); }
function labBuzz(on){
  if (on && !G.muted){
    if (L.buzz) return;
    var a = SFX.ctx && SFX.ctx(); if (!a) return;
    var o = a.createOscillator(), lfo = a.createOscillator(), lg = a.createGain(), g = a.createGain();
    o.type = "square"; o.frequency.value = 520; lfo.frequency.value = 30; lg.gain.value = 40;
    lfo.connect(lg); lg.connect(o.frequency); g.gain.value = 0.05;
    o.connect(g); g.connect(a.destination); o.start(); lfo.start();
    L.buzz = { o:o, lfo:lfo };
  } else if (L.buzz){ try { L.buzz.o.stop(); L.buzz.lfo.stop(); } catch(e){} L.buzz = null; }
}

function labStatus(key, msg){
  var s = el("lab-status"); if (!s) return;
  if (L.statusKey === key) return; L.statusKey = key;
  s.innerHTML = msg || ""; s.className = "lab-status" + (key === "short" || key === "burnt" ? " warn" : (msg ? " info" : ""));
}

function labShowWin(){
  var lv = LEVELS[L.level], box = el("lab-win"); if (!box) return;
  var next = L.level < LEVELS.length - 1;
  box.innerHTML = '<div class="success-box" style="text-align:left">🎉 Mission complete! <div style="font-weight:600;margin-top:6px">'+lv.why+'</div>'
    + '<div style="font-weight:600;margin-top:8px;color:#0f766e">🧰 Build it for real: '+lv.real+'</div>'
    + (next?'<button class="btn-primary" id="lab-next" style="margin-top:10px">Next mission →</button>':'')+'</div>';
  var nb = el("lab-next"); if (nb) nb.onclick = function(){ labSetLevel(L.level + 1); };
}

/* ---------- Loop ---------- */
function labLoop(now){
  if (!L.cv || !document.body.contains(L.cv)){ L.raf = 0; labBuzz(false); return; }
  var dt = Math.min(0.05, (now - L.last) / 1000); L.last = now; L.t += dt;
  // simulate
  var r = labResults(); L.res = r;
  L.comps.forEach(function(c, i){
    var x = r[i]; if (!x) return;
    if (c.type === "led"){
      c.ledOn = x.ledOn;
      if (!c.burnt && x.ledI > 0.06){ c.burnt = true; SFX.brick(); labPuff(c, "#9ca3af", 18); labStatus("burnt", "💥 POP! The LED burnt out — too much electricity. Tap it to fit a new one, and add a resistor to protect it."); }
    }
    if (c.type === "motor") c.ang += x.speed * dt * 14 * (x.I >= 0 ? 1 : -1);
    if (x.short && Math.random() < dt * 14) labPuff(c, "#6b7280", 1);
  });
  var shorted = anyShort(r);
  if (shorted){ labStatus("short", "⚠️ SHORT CIRCUIT! The electricity is taking a shortcut straight back to the battery, so it's getting HOT. Remove the shortcut wire!"); if (!L.shortWarned){ L.shortWarned = true; SFX.miss(); } }
  else { L.shortWarned = false; if (L.statusKey === "short") labStatus("", ""); }
  labBuzz(r.some(function(x){ return x.type === "buzzer" && x.on; }));
  // mission check (must stay true for a moment)
  var lv = LEVELS[L.level];
  if (lv.check && !L.solved){
    if (lv.check()){ L.okTime += dt; if (L.okTime > 0.5){ L.solved = true;
        if (!L.done[L.level]){ L.done[L.level] = true; labSave(); award(2, "Circuit mission complete!"); } else SFX.fanfare();
        labShowWin(); var chip = document.querySelector('.lv-chip[data-lv="'+L.level+'"]'); if (chip && chip.textContent.indexOf("✅") < 0) chip.textContent = "✅ " + chip.textContent; } }
    else {
      L.okTime = 0; L.nearIn = (L.nearIn || 0) - dt;
      if (lv.near && L.nearIn <= 0 && !shorted && L.statusKey !== "burnt"){
        L.nearIn = 0.5; var tip = lv.near();
        if (tip) labStatus("near:" + tip, "🤔 " + tip); else if (L.statusKey.indexOf("near:") === 0) labStatus("", "");
      }
    }
  }
  // smoke particles
  for (var k = L.smoke.length - 1; k >= 0; k--){ var s = L.smoke[k]; s.x += s.vx*dt; s.y += s.vy*dt; s.r += 10*dt; s.life -= dt*0.8; if (s.life <= 0) L.smoke.splice(k, 1); }
  labDraw();
  L.raf = requestAnimationFrame(labLoop);
}
function labPuff(c, color, n){
  var ctr = compCenter(c);
  for (var i = 0; i < n; i++) L.smoke.push({ x:ctr.x + (Math.random()-0.5)*20, y:ctr.y - 10, vx:(Math.random()-0.5)*30, vy:-30 - Math.random()*30, r:4 + Math.random()*4, life:1, color:color });
}

/* ---------- Drawing (every part is drawn from simple shapes) ---------- */
function labDraw(){
  var c = L.cx, w = L.w, h = L.h, cell = L.cell;
  c.clearRect(0, 0, w, h);
  c.fillStyle = L.night ? "#1e1b4b" : "#f8fafc"; c.fillRect(0, 0, w, h);
  c.fillStyle = L.night ? "#3730a3" : "#cbd5e1";
  for (var gx = 0; gx <= L.cols; gx++) for (var gy = 0; gy <= L.rows; gy++){ c.beginPath(); c.arc(gx*cell, gy*cell, 1.5, 0, 6.28); c.fill(); }
  if (L.night){ c.fillStyle = "#fef9c3"; c.beginPath(); c.arc(w - 26, 24, 11, 0, 6.28); c.fill(); c.fillStyle = "#1e1b4b"; c.beginPath(); c.arc(w - 21, 20, 10, 0, 6.28); c.fill(); }

  L.comps.forEach(function(comp, i){ drawPart(c, comp, L.res[i] || {}); });

  // wires (on top so the crocodile clips sit on the studs)
  L.wires.forEach(function(wire, i){
    var q = wireCurve(wire), sel = L.sel && L.sel.kind === "wire" && L.sel.w === wire;
    c.lineCap = "round";
    if (sel){ c.strokeStyle = "rgba(59,130,246,.35)"; c.lineWidth = 11; c.beginPath(); c.moveTo(q.A.x, q.A.y); c.quadraticCurveTo(q.C.x, q.C.y, q.B.x, q.B.y); c.stroke(); }
    c.strokeStyle = wire.color; c.lineWidth = 4.5; c.beginPath(); c.moveTo(q.A.x, q.A.y); c.quadraticCurveTo(q.C.x, q.C.y, q.B.x, q.B.y); c.stroke();
    clip(c, q.A, q.C, wire.color); clip(c, q.B, q.C, wire.color);
    var I = (L.res.wireI && L.res.wireI[i]) || 0;
    if (Math.abs(I) > 0.002){
      var len = Math.hypot(q.B.x - q.A.x, q.B.y - q.A.y) + 20, sp = Math.min(160, 25 + Math.abs(I) * 110);
      var dir = I > 0 ? -1 : 1;   // electrons go the opposite way to conventional current
      var gap = 16, off = ((L.t * sp * dir) % gap + gap) % gap;
      c.fillStyle = "#fde047";
      for (var s = off; s < len; s += gap){ var pt = qpt(q, s / len); c.beginPath(); c.arc(pt.x, pt.y, 2.4, 0, 6.28); c.fill(); }
    }
  });

  // terminals highlight while wiring
  if (L.pending){ var pc = findComp(L.pending.c); if (pc){ var pp = termPos(pc, L.pending.t); c.strokeStyle = "#3b82f6"; c.lineWidth = 3; c.beginPath(); c.arc(pp.x, pp.y, 11 + Math.sin(L.t*8)*2, 0, 6.28); c.stroke(); } }
  if (L.drag && L.drag.kind === "wire"){
    var fc = findComp(L.drag.from.c);
    if (fc){ var fp = termPos(fc, L.drag.from.t); c.strokeStyle = "rgba(59,130,246,.8)"; c.lineWidth = 4; c.setLineDash([6,6]); c.beginPath(); c.moveTo(fp.x, fp.y); c.lineTo(L.drag.x, L.drag.y); c.stroke(); c.setLineDash([]); }
  }
  L.smoke.forEach(function(s){ c.globalAlpha = Math.max(0, s.life * 0.6); c.fillStyle = s.color; c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.28); c.fill(); });
  c.globalAlpha = 1;
  if (!L.comps.length){
    c.fillStyle = L.night ? "#a5b4fc" : "#94a3b8"; c.textAlign = "center"; c.font = "700 14px Poppins, Arial, sans-serif";
    c.fillText("Tap a part below to put it on the board 👇", w/2, h/2);
  }
}
function clip(c, P, toward, color){
  var a = Math.atan2(toward.y - P.y, toward.x - P.x);
  c.save(); c.translate(P.x, P.y); c.rotate(a);
  c.fillStyle = color; rr(c, 2, -5, 16, 10, 3); c.fill();
  c.fillStyle = "#cbd5e1"; c.beginPath(); c.moveTo(-3, -4); c.lineTo(5, -5); c.lineTo(5, 5); c.lineTo(-3, 4); c.closePath(); c.fill();
  c.restore();
}

function drawPart(c, comp, r){
  var ctr = compCenter(comp), s = L.cell * 0.74, h = s/2;
  var sel = L.sel && L.sel.kind === "comp" && L.sel.c === comp;
  c.save(); c.translate(ctr.x, ctr.y);
  // glow behind lit parts
  if (comp.type === "bulb" && r.bright > 0.02){
    var vb = Math.pow(r.bright, 0.6), gr = s * (0.6 + Math.min(1.5, vb) * 0.9), gg = c.createRadialGradient(0, 0, 4, 0, 0, gr);
    gg.addColorStop(0, "rgba(253,224,71," + Math.min(0.9, vb) + ")"); gg.addColorStop(1, "rgba(253,224,71,0)");
    c.fillStyle = gg; c.beginPath(); c.arc(0, 0, gr, 0, 6.28); c.fill();
  }
  if (comp.type === "led" && r.on && !comp.burnt){
    var lr = s * 0.9, lg = c.createRadialGradient(0, 0, 3, 0, 0, lr);
    lg.addColorStop(0, "rgba(239,68,68," + (0.3 + r.bright*0.6) + ")"); lg.addColorStop(1, "rgba(239,68,68,0)");
    c.fillStyle = lg; c.beginPath(); c.arc(0, 0, lr, 0, 6.28); c.fill();
  }
  c.rotate(comp.rot * Math.PI / 2);
  // the tile (like a 3D-printed circuit tile)
  if (sel){ c.strokeStyle = "#3b82f6"; c.lineWidth = 4; rr(c, -h - 4, -h - 4, s + 8, s + 8, 12); c.stroke(); }
  c.fillStyle = r.short ? "#fecaca" : "#ffffff"; rr(c, -h, -h, s, s, 10); c.fill();
  c.strokeStyle = "#cbd5e1"; c.lineWidth = 2; c.stroke();
  // metal track + studs
  c.strokeStyle = "#94a3b8"; c.lineWidth = 3;
  c.beginPath(); c.moveTo(-L.cell*0.42, 0); c.lineTo(-h*0.55, 0); c.moveTo(h*0.55, 0); c.lineTo(L.cell*0.42, 0); c.stroke();
  [-1, 1].forEach(function(sx){ c.fillStyle = "#64748b"; c.beginPath(); c.arc(sx * L.cell*0.42, 0, 6, 0, 6.28); c.fill(); c.fillStyle = "#e2e8f0"; c.beginPath(); c.arc(sx * L.cell*0.42 - 1.5, -1.5, 2, 0, 6.28); c.fill(); });
  var u = s / 60;   // drawing unit, so parts scale with the board
  c.scale(u, u);
  switch (comp.type){
    case "battery":
      rr(c, -20, -11, 36, 22, 4); c.fillStyle = r.short ? "#dc2626" : "#1f2937"; c.fill();
      c.fillStyle = "#f59e0b"; rr(c, 4, -11, 12, 22, 3); c.fill();
      c.fillStyle = "#9ca3af"; c.fillRect(16, -5, 4, 10);
      c.fillStyle = "#fff"; c.font = "900 13px Arial"; c.textAlign = "center"; c.textBaseline = "middle";
      c.save(); c.rotate(-comp.rot * Math.PI/2); c.restore();
      c.fillText("−", -12, 0); c.fillStyle = "#1f2937"; c.fillText("+", 10, 0);
      break;
    case "bulb":
      c.strokeStyle = "#475569"; c.lineWidth = 2;
      c.fillStyle = r.bright > 0.02 ? "rgba(253,224,71," + (0.3 + Math.min(1, Math.pow(r.bright, 0.6))*0.7) + ")" : "rgba(226,232,240,.8)";
      c.beginPath(); c.arc(0, -4, 14, 0, 6.28); c.fill(); c.stroke();
      c.fillStyle = "#94a3b8"; c.fillRect(-7, 9, 14, 8);
      c.strokeStyle = r.bright > 0.02 ? "#ea580c" : "#64748b"; c.beginPath(); c.moveTo(-5, 9); c.lineTo(-4, -4); c.lineTo(-1, -8); c.lineTo(1, -2); c.lineTo(4, -8); c.lineTo(5, 9); c.stroke();
      break;
    case "switch":
      c.fillStyle = "#475569"; c.beginPath(); c.arc(-14, 0, 4, 0, 6.28); c.arc(14, 0, 4, 0, 6.28); c.fill();
      c.strokeStyle = comp.on ? "#16a34a" : "#dc2626"; c.lineWidth = 4; c.lineCap = "round";
      c.beginPath(); c.moveTo(-14, 0); c.lineTo(comp.on ? 14 : 8, comp.on ? 0 : -16); c.stroke();
      c.fillStyle = comp.on ? "#16a34a" : "#dc2626"; c.font = "800 9px Arial"; c.textAlign = "center"; c.fillText(comp.on ? "ON" : "OFF", 0, 18);
      break;
    case "button":
      c.fillStyle = "#334155"; rr(c, -14, -2, 28, 12, 3); c.fill();
      c.fillStyle = comp.pressed ? "#b91c1c" : "#ef4444"; c.beginPath(); c.ellipse(0, comp.pressed ? 0 : -5, 10, 6, 0, 0, 6.28); c.fill();
      if (!comp.pressed){ c.fillStyle = "#b91c1c"; c.fillRect(-10, -5, 20, 5); c.fillStyle = "#ef4444"; c.beginPath(); c.ellipse(0, -8, 10, 6, 0, 0, 6.28); c.fill(); }
      break;
    case "buzzer":
      c.fillStyle = "#111827"; c.beginPath(); c.arc(0, 0, 13, 0, 6.28); c.fill();
      c.fillStyle = "#374151"; c.beginPath(); c.arc(0, 0, 4, 0, 6.28); c.fill();
      if (r.on){ c.strokeStyle = "#f59e0b"; c.lineWidth = 2; for (var k = 1; k <= 2; k++){ var rad = 14 + k*5 + (L.t*30 % 5); c.beginPath(); c.arc(0, 0, rad, -0.6, 0.6); c.stroke(); c.beginPath(); c.arc(0, 0, rad, Math.PI-0.6, Math.PI+0.6); c.stroke(); } }
      break;
    case "motor":
      c.fillStyle = "#94a3b8"; c.beginPath(); c.arc(0, 0, 9, 0, 6.28); c.fill();
      c.save(); c.rotate(comp.ang); c.fillStyle = "#3b82f6";
      for (var b = 0; b < 3; b++){ c.rotate(Math.PI*2/3); c.beginPath(); c.ellipse(0, -12, 5, 11, 0, 0, 6.28); c.fill(); }
      c.restore(); c.fillStyle = "#1e3a8a"; c.beginPath(); c.arc(0, 0, 3, 0, 6.28); c.fill();
      break;
    case "led":
      c.strokeStyle = "#94a3b8"; c.lineWidth = 2; c.beginPath(); c.moveTo(-5, 6); c.lineTo(-5, 0); c.moveTo(5, 6); c.lineTo(5, 0); c.stroke();
      c.fillStyle = comp.burnt ? "#6b7280" : (r.on ? "#ff1f1f" : "#991b1b");
      c.beginPath(); c.arc(0, -6, 9, Math.PI, 0); c.lineTo(9, 4); c.lineTo(-9, 4); c.closePath(); c.fill();
      if (comp.burnt){ c.strokeStyle = "#111"; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-4, -12); c.lineTo(0, -6); c.lineTo(-2, -2); c.lineTo(3, 2); c.stroke(); }
      c.fillStyle = "#475569"; c.font = "900 11px Arial"; c.textAlign = "center"; c.fillText("+", 18, -8); c.fillText("−", -18, -8);
      break;
    case "resistor":
      c.fillStyle = "#e7c9a0"; rr(c, -16, -7, 32, 14, 6); c.fill();
      ["#a16207","#111827","#dc2626","#ca8a04"].forEach(function(col, k){ c.fillStyle = col; c.fillRect(-10 + k*6, -7, 3, 14); });
      break;
    case "sensor":
      c.fillStyle = "#fde68a"; c.beginPath(); c.arc(0, 0, 13, 0, 6.28); c.fill();
      c.strokeStyle = "#b45309"; c.lineWidth = 2; c.beginPath(); c.moveTo(-8, -4); c.lineTo(-4, 4); c.lineTo(0, -4); c.lineTo(4, 4); c.lineTo(8, -4); c.stroke();
      c.fillStyle = L.night ? "#4338ca" : "#f59e0b"; c.font = "10px Arial"; c.textAlign = "center"; c.fillText(L.night ? "dark" : "light", 0, 22);
      break;
  }
  c.restore();
}

/* simple picture of a loop circuit: battery on the left, parts along the top */
function loopSvg(parts){
  var n = parts.length, w = 340, h = 150, x0 = 50, x1 = 300, y0 = 30, y1 = 120;
  var s = '<svg viewBox="0 0 '+w+' '+h+'" class="loop-svg" role="img" aria-label="Circuit diagram">';
  s += '<rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+'" rx="14" fill="none" stroke="#f59e0b" stroke-width="4"/>';
  // battery on the left side
  s += '<rect x="'+(x0-22)+'" y="'+(y0+20)+'" width="44" height="50" rx="8" fill="#1f2937"/>'
    + '<text x="'+x0+'" y="'+(y0+42)+'" text-anchor="middle" font-size="13" fill="#fbbf24" font-weight="800">+</text>'
    + '<text x="'+x0+'" y="'+(y0+64)+'" text-anchor="middle" font-size="15" fill="#fff" font-weight="800">−</text>'
    + '<text x="'+(x0+30)+'" y="'+(y1+24)+'" font-size="11" fill="#64748b" font-weight="700">🔋 Battery</text>';
  parts.forEach(function(p, i){
    var cx = x0 + (x1 - x0) * (i + 1) / (n + 1), em = p.split(" ")[0], label = p.slice(em.length + 1);
    s += '<circle cx="'+cx+'" cy="'+y0+'" r="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>'
      + '<text x="'+cx+'" y="'+(y0+7)+'" text-anchor="middle" font-size="20">'+em+'</text>'
      + '<text x="'+cx+'" y="'+(y0+40)+'" text-anchor="middle" font-size="11" fill="#334155" font-weight="700">'+label+'</text>';
  });
  // electron dots
  s += '<circle r="4" fill="#fde047"><animateMotion dur="4s" repeatCount="indefinite" path="M'+x0+' '+(y0+14)+' V'+y0+' H'+x1+' V'+y1+' H'+x0+' Z"/></circle>';
  return s + '</svg>';
}

/* ================= GAME (v2: canvas + code-drawn art + Web Audio) ================= */
var G = { playing:false, score:0, lives:3, _ten:false, muted:false };

/* ---------- Sound: every effect is generated in code, no audio files ---------- */
var SFX = (function(){
  var ctx = null;
  function ac(){
    if (G.muted) return null;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
    } catch(e){ return null; }
    return ctx;
  }
  // one beep: wave type, start freq, end freq, length (s), volume, delay (s)
  function tone(type, f1, f2, len, vol, delay){
    var c = ac(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + len + 0.02);
  }
  // a burst of random noise (crunch / thud)
  function noise(len, vol, freq){
    var c = ac(); if (!c) return;
    var n = Math.floor(c.sampleRate * len), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = b; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  }
  return {
    ctx:     ac,
    star:    function(){ tone("sine", 880, 880, 0.12, 0.25); tone("sine", 1320, 1320, 0.18, 0.22, 0.07); },
    battery: function(){ tone("square", 300, 1200, 0.22, 0.08); tone("sine", 1200, 1200, 0.1, 0.12, 0.2); },
    brick:   function(){ noise(0.25, 0.6, 600); tone("sawtooth", 120, 50, 0.3, 0.15); },
    miss:    function(){ tone("triangle", 500, 220, 0.25, 0.2); },
    start:   function(){ tone("square", 520, 520, 0.08, 0.08); tone("square", 780, 780, 0.08, 0.08, 0.1); tone("square", 1040, 1040, 0.12, 0.08, 0.2); },
    fanfare: function(){ [523, 659, 784, 1047].forEach(function(f, i){ tone("triangle", f, f, 0.18, 0.2, i * 0.11); }); },
    over:    function(){ [440, 370, 311, 220].forEach(function(f, i){ tone("triangle", f, f * 0.97, 0.28, 0.2, i * 0.22); }); }
  };
})();

/* ---------- Game world ---------- */
var W = { cv:null, cx:null, w:0, h:0, dpr:1, raf:0, last:0, t:0,
          robot:{ x:0.5, tx:0.5, vx:0, squash:0, blink:0, look:0, wheel:0, hurt:0 },
          items:[], parts:[], texts:[], spawnIn:0, speed:0, shake:0, bg:[] };

function renderGame(){
  var html = '<div class="page"><h2 class="page-title">🎮 Robot Catch</h2>'
    + '<p class="page-sub">Catch ⭐ stars and 🔋 batteries with your robot. Miss the good ones or catch a 🧱 and you lose a life!</p>'
    + '<div class="game-stats"><span id="gs-score">🏆 '+G.score+'</span><span id="gs-best">🥇 Best '+BEST.score+'</span><span id="gs-lives">'+"❤️".repeat(Math.max(0,G.lives))+'</span>'
    + '<span id="gs-mute" style="cursor:pointer;margin-left:auto">'+(G.muted?"🔇 Sound off":"🔊 Sound on")+'</span></div>'
    + '<div id="game-area"><canvas id="game-canvas" style="display:block;width:100%;height:100%"></canvas>'
    + (G.playing?"":'<div class="game-overlay" id="game-ov"><div class="t">'+(G.lives<=0?("💥 Game over! Score: "+G.score):"🎮 Robot Catch")+'</div><button class="start" id="game-start">'+(G.lives<=0?"Play again!":"Start!")+'</button></div>')
    + '</div><p class="tiny-tip">Move your finger or mouse across the game area to steer 🤖 (or use ← → keys).</p></div>';
  el("app").innerHTML = html;
  var area = el("game-area");
  W.cv = el("game-canvas"); W.cx = W.cv.getContext("2d");
  sizeCanvas();
  function move(clientX){
    var r = area.getBoundingClientRect();
    W.robot.tx = Math.max(0.06, Math.min(0.94, (clientX - r.left) / r.width));
  }
  area.addEventListener("pointermove", function(e){ if (G.playing) move(e.clientX); });
  area.addEventListener("pointerdown", function(e){ if (G.playing) move(e.clientX); });
  el("gs-mute").onclick = function(){ G.muted = !G.muted; this.textContent = G.muted ? "🔇 Sound off" : "🔊 Sound on"; };
  var st = el("game-start"); if (st) st.onclick = startGame;
  if (!W.raf){ W.last = performance.now(); W.raf = requestAnimationFrame(loop); }
}

function sizeCanvas(){
  if (!W.cv) return;
  var r = W.cv.getBoundingClientRect();
  W.dpr = Math.min(window.devicePixelRatio || 1, 2);
  W.w = r.width; W.h = r.height;
  W.cv.width = Math.round(r.width * W.dpr); W.cv.height = Math.round(r.height * W.dpr);
  W.cx.setTransform(W.dpr, 0, 0, W.dpr, 0, 0);
  if (!W.bg.length) for (var i = 0; i < 40; i++) W.bg.push({ x:Math.random(), y:Math.random()*0.8, r:0.6+Math.random()*1.8, p:Math.random()*6.28 });
}
window.addEventListener("resize", sizeCanvas);
window.addEventListener("keydown", function(e){
  if (S.tab !== "game" || !G.playing) return;
  if (e.key === "ArrowLeft")  { W.robot.tx = Math.max(0.06, W.robot.tx - 0.08); e.preventDefault(); }
  if (e.key === "ArrowRight") { W.robot.tx = Math.min(0.94, W.robot.tx + 0.08); e.preventDefault(); }
});

function updateHud(){
  var s = el("gs-score"), b = el("gs-best"), l = el("gs-lives");
  if (s) s.textContent = "🏆 " + G.score;
  if (b) b.textContent = "🥇 Best " + BEST.score;
  if (l) l.textContent = "❤️".repeat(Math.max(0, G.lives)) || "💔";
}

function startGame(){
  G.playing = true; G.score = 0; G.lives = 3; G._ten = false;
  W.items = []; W.parts = []; W.texts = []; W.spawnIn = 0.4; W.speed = 0;
  var ov = el("game-ov"); if (ov) ov.remove();
  updateHud(); SFX.start();
}

function endGame(){
  G.playing = false; SFX.over();
  if (S.tab === "game") render();
}

/* ---------- Particles: lots of tiny shapes, each with a simple rule ---------- */
function burst(x, y, color, n, power){
  for (var i = 0; i < n; i++){
    var a = Math.random() * 6.28, sp = (0.3 + Math.random()) * power;
    W.parts.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - power*0.4, life:1, size:2+Math.random()*3, color:color, star:Math.random()<0.4 });
  }
}
function floatText(x, y, txt, color){ W.texts.push({ x:x, y:y, txt:txt, color:color, life:1 }); }

/* ---------- The game loop: input → update → collisions → draw, ~60x a second ---------- */
function loop(now){
  if (!W.cv || !document.body.contains(W.cv)) { W.raf = 0; return; }   // left the game tab: stop
  var dt = Math.min(0.05, (now - W.last) / 1000); W.last = now; W.t += dt;
  update(dt); draw();
  W.raf = requestAnimationFrame(loop);
}

function update(dt){
  var R = W.robot, groundY = W.h - 30;
  // robot glides toward the finger with a springy feel
  var prev = R.x;
  R.x += (R.tx - R.x) * Math.min(1, dt * 12);
  R.vx = (R.x - prev) / dt;
  R.wheel += R.vx * dt * 40;
  R.squash *= Math.pow(0.02, dt);
  R.hurt = Math.max(0, R.hurt - dt);
  R.blink -= dt; if (R.blink < -0.15) R.blink = 2 + Math.random() * 3;
  W.shake *= Math.pow(0.01, dt);

  if (G.playing){
    W.speed += dt * 0.012;                       // slowly gets harder
    W.spawnIn -= dt;
    if (W.spawnIn <= 0){
      var r = Math.random();
      W.items.push({ x:0.08 + Math.random()*0.84, y:-20, vy:90 + Math.random()*30,
                     type: r < 0.25 ? "brick" : (r < 0.62 ? "star" : "battery"), rot:Math.random()*6, spin:(Math.random()-0.5)*3 });
      W.spawnIn = Math.max(0.38, 0.9 - W.speed * 0.6) * (0.7 + Math.random()*0.6);
    }
  }

  // nearest item: the robot's eyes follow it
  var near = null;
  for (var i = W.items.length - 1; i >= 0; i--){
    var it = W.items[i];
    it.vy += 60 * dt * (1 + W.speed); it.y += it.vy * dt; it.rot += it.spin * dt;
    if (!near || it.y > near.y) near = it;
    var px = it.x * W.w, rx = R.x * W.w;
    if (it.y > groundY - 58 && it.y < groundY - 20 && Math.abs(px - rx) < 40){
      W.items.splice(i, 1);
      if (it.type === "brick"){
        G.lives--; R.hurt = 0.5; W.shake = 10; SFX.brick();
        burst(px, it.y, "#b45309", 18, 220); floatText(px, it.y - 10, "OUCH!", "#dc2626");
      } else {
        G.score++; R.squash = 1;
        if (it.type === "star"){ SFX.star(); burst(px, it.y, "#facc15", 16, 180); }
        else { SFX.battery(); burst(px, it.y, "#22c55e", 16, 180); }
        floatText(px, it.y - 10, "+1", it.type === "star" ? "#d97706" : "#16a34a");
        if (G.score > BEST.score){ BEST.score = G.score; save(); }
        if (G.score % 10 === 0){ SFX.fanfare(); award(2, "10 catches! ⭐⭐"); burst(rx, groundY - 60, "#a855f7", 40, 300); }
      }
      updateHud();
      if (G.lives <= 0){ endGame(); return; }
      continue;
    }
    if (it.y > groundY + 10){
      W.items.splice(i, 1);
      if (it.type !== "brick" && G.playing){
        G.lives--; SFX.miss(); burst(px, groundY, "#94a3b8", 10, 120); floatText(px, groundY - 20, "missed!", "#64748b");
        updateHud();
        if (G.lives <= 0){ endGame(); return; }
      }
    }
  }
  R.look = near ? Math.max(-1, Math.min(1, (near.x - R.x) * 4)) : 0;

  for (var j = W.parts.length - 1; j >= 0; j--){
    var p = W.parts[j]; p.vy += 400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.4;
    if (p.life <= 0) W.parts.splice(j, 1);
  }
  for (var k = W.texts.length - 1; k >= 0; k--){
    var t = W.texts[k]; t.y -= 40 * dt; t.life -= dt; if (t.life <= 0) W.texts.splice(k, 1);
  }
}

/* ---------- Drawing: every picture below is made from simple shapes ---------- */
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r); c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath(); }
function starPath(c, r, inner){ c.beginPath(); for (var i = 0; i < 10; i++){ var a = -Math.PI/2 + i*Math.PI/5, rad = i%2 ? r*inner : r; c.lineTo(Math.cos(a)*rad, Math.sin(a)*rad); } c.closePath(); }

function draw(){
  var c = W.cx, w = W.w, h = W.h, groundY = h - 30;
  c.save();
  if (W.shake > 0.3) c.translate((Math.random()-0.5)*W.shake, (Math.random()-0.5)*W.shake);
  // sky
  var g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#dbeafe"); g.addColorStop(1, "#f5f3ff");
  c.fillStyle = g; c.fillRect(-20, -20, w+40, h+40);
  // twinkling dots
  W.bg.forEach(function(s){ c.globalAlpha = 0.25 + 0.25*Math.sin(W.t*2 + s.p); c.fillStyle = "#a5b4fc"; c.beginPath(); c.arc(s.x*w, s.y*h, s.r, 0, 6.28); c.fill(); });
  c.globalAlpha = 1;
  // ground with moving stripes
  c.fillStyle = "#c7d2fe"; c.fillRect(-20, groundY + 12, w + 40, 40);
  c.strokeStyle = "#a5b4fc"; c.lineWidth = 2;
  for (var x = -40 + ((W.t * 20) % 40); x < w + 40; x += 40){ c.beginPath(); c.moveTo(x, groundY + 12); c.lineTo(x - 14, h); c.stroke(); }

  W.items.forEach(function(it){ drawItem(c, it.x * w, it.y, it); });
  drawRobot(c, W.robot.x * w, groundY);

  W.parts.forEach(function(p){
    c.globalAlpha = Math.max(0, p.life); c.fillStyle = p.color;
    if (p.star){ c.save(); c.translate(p.x, p.y); c.rotate(p.life*6); starPath(c, p.size*1.6, 0.45); c.fill(); c.restore(); }
    else { c.beginPath(); c.arc(p.x, p.y, p.size, 0, 6.28); c.fill(); }
  });
  c.globalAlpha = 1;
  c.textAlign = "center"; c.font = "900 18px Poppins, Arial, sans-serif";
  W.texts.forEach(function(t){ c.globalAlpha = Math.max(0, t.life); c.fillStyle = t.color; c.fillText(t.txt, t.x, t.y); });
  c.globalAlpha = 1;
  c.restore();
}

function drawItem(c, x, y, it){
  c.save(); c.translate(x, y);
  if (it.type === "star"){
    c.rotate(it.rot);
    c.shadowColor = "rgba(250,204,21,.9)"; c.shadowBlur = 14;
    starPath(c, 17, 0.45); c.fillStyle = "#facc15"; c.fill();
    c.shadowBlur = 0; c.lineWidth = 2.5; c.strokeStyle = "#d97706"; c.stroke();
    c.fillStyle = "rgba(255,255,255,.7)"; c.beginPath(); c.arc(-4, -5, 3, 0, 6.28); c.fill();
  } else if (it.type === "battery"){
    c.rotate(Math.sin(it.rot) * 0.3);
    rr(c, -11, -18, 22, 36, 5); c.fillStyle = "#1f2937"; c.fill();
    c.fillStyle = "#9ca3af"; c.fillRect(-5, -23, 10, 6);
    var lvl = 0.5 + 0.5 * Math.sin(W.t * 6 + it.rot);          // charge bars pulse
    for (var i = 0; i < 3; i++){ c.fillStyle = i < 1 + lvl * 2.2 ? "#22c55e" : "#374151"; rr(c, -7, 8 - i*10, 14, 7, 2); c.fill(); }
  } else {
    c.rotate(it.rot * 0.4);
    rr(c, -22, -13, 44, 26, 3); c.fillStyle = "#dc2626"; c.fill();
    c.strokeStyle = "#7f1d1d"; c.lineWidth = 2; c.stroke();
    c.strokeStyle = "rgba(254,226,226,.8)"; c.beginPath();
    c.moveTo(-22, 0); c.lineTo(22, 0); c.moveTo(-6, -13); c.lineTo(-6, 0); c.moveTo(10, 0); c.lineTo(10, 13); c.stroke();
  }
  c.restore();
}

function drawRobot(c, x, groundY){
  var R = W.robot, sq = R.squash, bob = Math.sin(W.t * 5) * 2;
  var sx = 1 + sq * 0.18, sy = 1 - sq * 0.15, lean = Math.max(-0.25, Math.min(0.25, R.vx * 0.12));
  c.save(); c.translate(x, groundY);
  // shadow
  c.fillStyle = "rgba(67,56,202,.18)"; c.beginPath(); c.ellipse(0, 12, 34, 6, 0, 0, 6.28); c.fill();
  // wheels (spokes turn as it drives)
  [-20, 20].forEach(function(wx){
    c.save(); c.translate(wx, 2); c.fillStyle = "#1f2937"; c.beginPath(); c.arc(0, 0, 10, 0, 6.28); c.fill();
    c.rotate(R.wheel); c.strokeStyle = "#9ca3af"; c.lineWidth = 2;
    for (var i = 0; i < 3; i++){ c.rotate(Math.PI/3); c.beginPath(); c.moveTo(-7, 0); c.lineTo(7, 0); c.stroke(); }
    c.restore();
  });
  c.rotate(lean); c.scale(sx, sy); c.translate(0, bob);
  var body = R.hurt > 0 && Math.floor(R.hurt * 20) % 2 ? "#fca5a5" : "#ff8c00";
  // body
  rr(c, -26, -40, 52, 36, 9); c.fillStyle = body; c.fill(); c.lineWidth = 3; c.strokeStyle = "#c2410c"; c.stroke();
  // chest light (green when happy, red when hurt)
  c.fillStyle = R.hurt > 0 ? "#ef4444" : (sq > 0.3 ? "#facc15" : "#22c55e");
  c.beginPath(); c.arc(0, -22, 5, 0, 6.28); c.fill();
  // catching tray (arms)
  c.strokeStyle = "#475569"; c.lineWidth = 4; c.lineCap = "round";
  c.beginPath(); c.moveTo(-26, -30); c.lineTo(-36, -44); c.moveTo(26, -30); c.lineTo(36, -44); c.stroke();
  // head
  rr(c, -20, -72, 40, 30, 10); c.fillStyle = "#e0f2fe"; c.fill(); c.strokeStyle = "#0369a1"; c.lineWidth = 3; c.stroke();
  // eyes: follow the nearest falling thing, blink now and then
  var eyeH = R.blink < 0 ? 1.5 : 6, lx = R.look * 3;
  c.fillStyle = "#0f172a";
  [-8, 8].forEach(function(ex){ c.beginPath(); c.ellipse(ex + lx, -58, 4.5, eyeH, 0, 0, 6.28); c.fill(); });
  // mouth
  c.strokeStyle = "#0f172a"; c.lineWidth = 2; c.beginPath();
  if (R.hurt > 0){ c.moveTo(-6, -47); c.lineTo(6, -47); } else { c.arc(0, -51, 5, 0.2, Math.PI - 0.2); }
  c.stroke();
  // antenna that wobbles
  var aw = Math.sin(W.t * 8) * 4 - lean * 20;
  c.strokeStyle = "#475569"; c.lineWidth = 3; c.beginPath(); c.moveTo(0, -72); c.quadraticCurveTo(aw * 0.5, -80, aw, -88); c.stroke();
  c.fillStyle = sq > 0.3 ? "#facc15" : "#ef4444"; c.beginPath(); c.arc(aw, -90, 4.5, 0, 6.28); c.fill();
  c.restore();
}

   matching MakeCode blocks / JavaScript / Python to put on a real micro:bit. */

var STAMPS = {
  "❤️ Heart": ".#.#." + "#####" + "#####" + ".###." + "..#..",
  "🙂 Smile": "....." + ".#.#." + "....." + "#...#" + ".###.",
  "🙁 Sad":   "....." + ".#.#." + "....." + ".###." + "#...#",
  "➡️ Arrow": "..#.." + "...#." + "#####" + "...#." + "..#..",
  "✔️ Tick":  "....." + "....#" + "...#." + "#.#.." + ".#...",
  "🤖 Robot": "#####" + "#.#.#" + "#####" + ".###." + ".#.#.",
  "⭐ Star":  "..#.." + "#####" + ".###." + ".#.#." + "#...#"
};
function blankFrame(){ var f = []; for (var i = 0; i < 25; i++) f.push(false); return f; }
function stampFrame(s){ var f = []; for (var i = 0; i < 25; i++) f.push(s.charAt(i) === "#"); return f; }

var D = { frames:[stampFrame(STAMPS["❤️ Heart"])], cur:0, playing:false, playIdx:0, playT:0, pause:200,
          code:"blocks", coords:false, quest:null, paint:null, cv:null, cx:null, w:0, h:0, raf:0, last:0, t:0,
          copiedOnce:false, questDone:false };
function ledsLoad(){ try { var d = JSON.parse(localStorage.getItem("miniMakersLeds"));
  if (d && d.frames && d.frames.length){ D.frames = d.frames; D.pause = d.pause || 200; D.copiedOnce = !!d.copied; D.questDone = !!d.quest; } } catch(e){} }
function ledsSave(){ try { localStorage.setItem("miniMakersLeds", JSON.stringify({ frames:D.frames, pause:D.pause, copied:D.copiedOnce, quest:D.questDone })); } catch(e){} }
ledsLoad();

function frameOnScreen(){
  if (D.quest) return D.quest.grid;
  if (D.playing) return D.frames[D.playIdx % D.frames.length];
  return D.frames[D.cur];
}

  el("ld-add").onclick = function(){ if (D.frames.length >= 12) return; D.frames.splice(D.cur + 1, 0, blankFrame()); D.cur++; ledsAfter(); };
  el("ld-dup").onclick = function(){ if (D.frames.length >= 12) return; D.frames.splice(D.cur + 1, 0, D.frames[D.cur].slice()); D.cur++; ledsAfter(); };
  el("ld-del").onclick = function(){ if (D.frames.length <= 1){ ledsEdit(function(f){ for (var i = 0; i < 25; i++) f[i] = false; }); return; } D.frames.splice(D.cur, 1); D.cur = Math.max(0, D.cur - 1); ledsAfter(); };
  el("ld-play").onclick = function(){ ledsPlay(!D.playing); };
  el("ld-speed").onchange = function(){ D.pause = +this.value; ledsAfter(); };

function ledsSize(){
  if (!D.cv) return;
  var wrap = D.cv.parentNode, r = wrap.getBoundingClientRect();
  var w = Math.min(r.width, 420), h = w * 0.86;
  wrap.style.height = h + "px"; D.cv.style.width = w + "px"; D.cv.style.margin = "0 auto";
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  D.w = w; D.h = h; D.cv.width = Math.round(w * dpr); D.cv.height = Math.round(h * dpr);
  D.cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", function(){ if (S.tab === "leds") ledsSize(); });

/* ---------- Editing ---------- */
function ledsEdit(fn){ if (D.quest) return; ledsPlay(false); fn(D.frames[D.cur]); ledsAfter(); }
function ledsAfter(){ ledsFrames(); ledsCode(); ledsSave(); }
function ledsShift(dir){
  ledsEdit(function(f){
    var o = blankFrame();
    for (var y = 0; y < 5; y++) for (var x = 0; x < 5; x++){
      var sx = x, sy = y;
      if (dir === "L") sx = x + 1; if (dir === "R") sx = x - 1; if (dir === "U") sy = y + 1; if (dir === "D") sy = y - 1;
      o[y*5 + x] = (sx >= 0 && sx < 5 && sy >= 0 && sy < 5) ? f[sy*5 + sx] : false;
    }
    for (var i = 0; i < 25; i++) f[i] = o[i];
  });
}
function ledsPlay(on){
  D.playing = on && D.frames.length > 0; D.playIdx = D.cur; D.playT = 0;
  var b = el("ld-play"); if (b) b.textContent = D.playing ? "⏹ Stop" : "▶ Play";
}

/* geometry of the drawn micro:bit */
function ledGeo(){
  var g = D.w * 0.46, cell = g / 5;
  return { x0:(D.w - g)/2, y0:D.h * 0.17, cell:cell };
}
function ledAt(e){
  var r = D.cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, G = ledGeo();
  var x = Math.floor((px - G.x0) / G.cell), y = Math.floor((py - G.y0) / G.cell);
  if (x < 0 || x > 4 || y < 0 || y > 4) return null;
  return { x:x, y:y, i:y*5 + x };
}
function ledsDown(e){
  var p = ledAt(e); if (!p) return;
  D.cv.setPointerCapture(e.pointerId);
  if (D.quest){ questTap(p); return; }
  ledsPlay(false);
  var f = D.frames[D.cur]; D.paint = !f[p.i]; f[p.i] = D.paint; ledBlip(D.paint); D.lastI = p.i; ledsFrames(); ledsCode();
}
function ledsMove(e){
  if (D.paint === null || D.quest) return;
  var p = ledAt(e); if (!p || p.i === D.lastI) return;
  D.lastI = p.i; var f = D.frames[D.cur];
  if (f[p.i] !== D.paint){ f[p.i] = D.paint; ledBlip(D.paint); ledsFrames(); ledsCode(); }
}
function ledBlip(on){ var a = SFX.ctx && SFX.ctx(); if (!a) return; var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = "sine"; o.frequency.setValueAtTime(on ? 1200 : 700, t); g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.06); }

/* ---------- Frames strip ---------- */
function ledsFrames(){
  var box = el("led-frames"); if (!box) return;
  box.innerHTML = "";
  D.frames.forEach(function(f, i){
    var c = document.createElement("canvas"); c.width = 56; c.height = 56; c.className = "frame-th" + (i === D.cur ? " on" : "");
    var x = c.getContext("2d"); x.fillStyle = "#111827"; x.fillRect(0, 0, 56, 56);
    for (var k = 0; k < 25; k++){ x.fillStyle = f[k] ? "#ff3b3b" : "#3f2a2a"; x.fillRect(6 + (k%5)*9.4, 6 + Math.floor(k/5)*9.4, 6, 6); }
    c.title = "Frame " + (i + 1);
    c.onclick = function(){ if (D.quest) return; ledsPlay(false); D.cur = i; ledsFrames(); };
    var w = document.createElement("div"); w.className = "frame-w"; w.appendChild(c);
    var n = document.createElement("span"); n.textContent = i + 1; w.appendChild(n);
    box.appendChild(w);
  });
}

/* ---------- Code generation ---------- */
function ledRows(f, ind){ var s = ""; for (var y = 0; y < 5; y++){ var r = []; for (var x = 0; x < 5; x++) r.push(f[y*5 + x] ? "#" : "."); s += ind + r.join(" ") + "\n"; } return s; }
function ledsJS(){
  if (D.frames.length === 1) return "basic.showLeds(`\n" + ledRows(D.frames[0], "    ") + "    `)\n";
  var s = "basic.forever(function () {\n";
  D.frames.forEach(function(f){ s += "    basic.showLeds(`\n" + ledRows(f, "        ") + "        `)\n"; if (D.pause) s += "    basic.pause(" + D.pause + ")\n"; });
  return s + "})\n";
}
function ledsPy(){
  if (D.frames.length === 1) return 'basic.show_leds("""\n' + ledRows(D.frames[0], "    ") + '    """)\n';
  var s = "def on_forever():\n";
  D.frames.forEach(function(f){ s += '    basic.show_leds("""\n' + ledRows(f, "        ") + '        """)\n'; if (D.pause) s += "    basic.pause(" + D.pause + ")\n"; });
  return s + "basic.forever(on_forever)\n";
}
function blockGrid(f){ var s = '<span class="bk-grid">'; for (var i = 0; i < 25; i++) s += '<i class="'+(f[i]?"on":"")+'"></i>'; return s + '</span>'; }
function ledsBlocks(){
  var inner = D.frames.map(function(f){
    return '<div class="bk">show leds '+blockGrid(f)+'</div>' + (D.frames.length > 1 && D.pause ? '<div class="bk">pause (ms) <span class="bk-n">'+D.pause+'</span></div>' : '');
  }).join("");
  return '<div class="bk-hat">'+(D.frames.length > 1 ? "forever" : "on start")+'</div><div class="bk-body">'+inner+'</div><div class="bk-foot"></div>';
}
function ledsCode(){
  var box = el("led-code"); if (!box) return;
  document.querySelectorAll("[data-code]").forEach(function(b){ b.className = b.getAttribute("data-code") === D.code ? "on" : ""; });
  if (D.code === "blocks") box.innerHTML = '<div class="bk-wrap">' + ledsBlocks() + '</div>';
  else { var pre = document.createElement("pre"); pre.textContent = D.code === "js" ? ledsJS() : ledsPy(); box.innerHTML = ""; box.appendChild(pre); }
}
function ledsCopy(){
  var txt = D.code === "py" ? ledsPy() : ledsJS();
  function done(){
    var b = el("ld-copy"); if (b){ b.textContent = "✅ Copied!"; setTimeout(function(){ if (el("ld-copy")) el("ld-copy").textContent = "📋 Copy code"; }, 1800); }
    if (!D.copiedOnce){ D.copiedOnce = true; ledsSave(); award(1, "Code ready for your micro:bit!"); }
  }
  function fallback(){ var t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch(e){} t.remove(); done(); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
}

/* ---------- Coordinate Quest: find the LED at x, y ---------- */
function questStart(){
  ledsPlay(false);
  D.quest = { round:0, right:0, grid:blankFrame(), target:null, msg:"", flash:0 };
  questNext(); el("ld-quest").textContent = "✖ End quest";
}
function questNext(){
  var q = D.quest; q.round++; q.grid = blankFrame();
  var t; do { t = { x:Math.floor(Math.random()*5), y:Math.floor(Math.random()*5) }; } while (q.target && t.x === q.target.x && t.y === q.target.y);
  q.target = t; q.msg = ""; questUi();
}
function questTap(p){
  var q = D.quest;
  if (p.x === q.target.x && p.y === q.target.y){
    q.grid = blankFrame(); q.grid[p.i] = true; q.right++; q.flash = 0.6; SFX.star();
    q.msg = "✅ Yes! x=" + p.x + ", y=" + p.y;
    if (q.round >= 5){ setTimeout(function(){ questEnd(true); }, 700); }
    else setTimeout(function(){ if (D.quest === q) questNext(); }, 800);
  } else {
    SFX.miss(); q.grid = blankFrame(); q.grid[p.i] = true;
    q.msg = "That one is x=" + p.x + ", y=" + p.y + ". Remember: x counts ACROSS → and y counts DOWN ↓, both starting at 0.";
  }
  questUi();
}
function questEnd(won){
  var q = D.quest; D.quest = null;
  var b = el("ld-quest"); if (b) b.textContent = "🎯 Coordinate Quest";
  var box = el("led-quest");
  if (won && box){
    box.innerHTML = '<div class="success-box">🏆 Quest complete! You found all 5 LEDs. In MakeCode, <b>plot x y</b> uses these same numbers.</div>';
    SFX.fanfare(); if (!D.questDone){ D.questDone = true; ledsSave(); award(2, "Coordinate master!"); }
  } else if (box) box.innerHTML = "";
}
function questUi(){
  var box = el("led-quest"); if (!box) return;
  if (!D.quest){ return; }
  var q = D.quest;
  box.innerHTML = '<div class="mission"><div class="m-t">🎯 Round '+Math.min(q.round,5)+' of 5</div>Tap the LED at <b style="font-size:1.1rem">x = '+q.target.x+', y = '+q.target.y+'</b>'
    + (q.msg ? '<div style="margin-top:6px">'+q.msg+'</div>' : '') + '</div>';
}

/* ---------- Loop + drawing the micro:bit ---------- */
function ledsLoop(now){
  if (!D.cv || !document.body.contains(D.cv)){ D.raf = 0; return; }
  var dt = Math.min(0.05, (now - D.last) / 1000); D.last = now; D.t += dt;
  if (D.playing){
    D.playT += dt * 1000;
    var frameMs = 400 + D.pause;          // MakeCode's show leds waits 400 ms, then the pause
    if (D.playT >= frameMs){ D.playT = 0; D.playIdx = (D.playIdx + 1) % D.frames.length; }
  }
  if (D.quest && D.quest.flash > 0) D.quest.flash -= dt;
  ledsDraw();
  D.raf = requestAnimationFrame(ledsLoop);
}
function ledsDraw(){
  var c = D.cx, w = D.w, h = D.h, G = ledGeo(), f = frameOnScreen();
  c.clearRect(0, 0, w, h);
  // board
  var bh = h * 0.80;
  rr(c, 2, 2, w - 4, bh, 22); c.fillStyle = "#1f2937"; c.fill();
  // edge connector (gold)
  c.fillStyle = "#1f2937"; c.fillRect(2, bh - 30, w - 4, h - bh + 26);
  rr(c, 2, h - 40, w - 4, 38, 6); c.fillStyle = "#1f2937"; c.fill();
  var pads = [["0",0.12],["1",0.33],["2",0.54],["3V",0.73],["GND",0.90]];
  for (var t = 0; t < 40; t++){ c.fillStyle = "#c9a227"; c.fillRect(8 + t * ((w - 16) / 40), h - 14, (w - 16) / 40 - 2, 12); }
  pads.forEach(function(p){
    var px = w * p[1], pw = w * 0.11;
    c.fillStyle = "#e0b73a"; rr(c, px - pw/2, h - 44, pw, 40, 6); c.fill();
    c.fillStyle = "#1f2937"; c.beginPath(); c.arc(px, h - 30, pw * 0.22, 0, 6.28); c.fill();
    c.fillStyle = "#fff"; c.font = "700 " + Math.round(w*0.03) + "px Arial"; c.textAlign = "center"; c.fillText(p[0], px, h - 50);
  });
  // logo (V2 touch logo)
  var lx = w/2, ly = h * 0.08;
  c.strokeStyle = "#e0b73a"; c.lineWidth = 3; c.beginPath(); c.ellipse(lx, ly, w*0.05, w*0.03, 0, 0, 6.28); c.stroke();
  c.fillStyle = "#e0b73a"; c.beginPath(); c.arc(lx - w*0.022, ly, 3, 0, 6.28); c.arc(lx + w*0.022, ly, 3, 0, 6.28); c.fill();
  // buttons A and B
  [["A", w*0.13], ["B", w*0.87]].forEach(function(b){
    var by = G.y0 + G.cell * 2.5, r = w * 0.06;
    c.fillStyle = "#9ca3af"; rr(c, b[1] - r*1.3, by - r*1.3, r*2.6, r*2.6, 6); c.fill();
    c.fillStyle = "#111827"; c.beginPath(); c.arc(b[1], by, r, 0, 6.28); c.fill();
    c.fillStyle = "#fff"; c.font = "800 " + Math.round(w*0.045) + "px Arial"; c.textAlign = "center"; c.fillText(b[0], b[1], by - r*1.6);
  });
  // LEDs
  for (var i = 0; i < 25; i++){
    var x = i % 5, y = Math.floor(i / 5);
    var cx = G.x0 + (x + 0.5) * G.cell, cy = G.y0 + (y + 0.5) * G.cell, lw = G.cell * 0.26, lh = G.cell * 0.46;
    if (f[i]){
      var gl = c.createRadialGradient(cx, cy, 2, cx, cy, G.cell * 0.75);
      gl.addColorStop(0, "rgba(255,60,60,.75)"); gl.addColorStop(1, "rgba(255,60,60,0)");
      c.fillStyle = gl; c.beginPath(); c.arc(cx, cy, G.cell * 0.75, 0, 6.28); c.fill();
    }
    c.fillStyle = f[i] ? "#ff4040" : "#4b3535"; rr(c, cx - lw/2, cy - lh/2, lw, lh, 2); c.fill();
    if (f[i]){ c.fillStyle = "rgba(255,230,230,.9)"; c.fillRect(cx - lw*0.2, cy - lh*0.35, lw*0.4, lh*0.7); }
  }
  // target ring in the quest (only flashes after a correct answer)
  if (D.quest && D.quest.flash > 0){
    var tx = G.x0 + (D.quest.target.x + 0.5) * G.cell, ty = G.y0 + (D.quest.target.y + 0.5) * G.cell;
    c.strokeStyle = "rgba(250,204,21," + D.quest.flash + ")"; c.lineWidth = 3; c.beginPath(); c.arc(tx, ty, G.cell * 0.5, 0, 6.28); c.stroke();
  }
  // x,y labels
  if (D.coords || D.quest){
    c.fillStyle = "#93c5fd"; c.font = "800 " + Math.round(G.cell * 0.32) + "px Arial"; c.textAlign = "center"; c.textBaseline = "middle";
    for (var k = 0; k < 5; k++){
      c.fillText(k, G.x0 + (k + 0.5) * G.cell, G.y0 - G.cell * 0.35);
      c.fillText(k, G.x0 - G.cell * 0.35, G.y0 + (k + 0.5) * G.cell);
    }
    c.fillStyle = "#fde68a"; c.font = "800 " + Math.round(G.cell * 0.28) + "px Arial";
    c.fillText("x →", G.x0 + G.cell * 5 + G.cell * 0.45, G.y0 - G.cell * 0.35);
    c.fillText("y ↓", G.x0 - G.cell * 0.35, G.y0 + G.cell * 5 + G.cell * 0.35);
    c.textBaseline = "alphabetic";
  }
  if (D.playing){ c.fillStyle = "#86efac"; c.font = "800 " + Math.round(w*0.035) + "px Arial"; c.textAlign = "left"; c.fillText("▶ frame " + (D.playIdx + 1) + "/" + D.frames.length, 14, 24); }
}

/* ================= ROVER LANDER (inspired by PhET's Lunar Lander) ================= */
/* Land gently on the pad. Gravity is different on each world, so the same lander feels
   heavier on Earth than on the Moon. Everything is drawn and voiced in code. */

var PLANETS = {
  moon:  { name:"Moon",  emoji:"🌙", g:18, fuel:100, sky:["#0b1026","#1e1b4b"], ground:"#9ca3af", rock:"#6b7280",

  mars:  { name:"Mars",  emoji:"🔴", g:32, fuel:110, sky:["#3b0a0a","#9a3412"], ground:"#c2410c", rock:"#7c2d12",

var LANDER = { thrust:78, side:34, burn:11, sideBurn:4, safeVy:42, safeVx:26 };

/* terrain: bumpy ground with one flat landing pad that gets smaller each level */
function landerWorld(){
  var w = LD.w, h = LD.h, pts = [], step = 24, base = h * 0.80, rough = Math.min(70, 20 + LD.level * 8);
  var padW = Math.max(46, 100 - (LD.level - 1) * 9), padX = 30 + Math.random() * (w - padW - 60);
  var y = base;
  for (var x = 0; x <= w + step; x += step){
    if (x >= padX - step && x <= padX + padW + step){ y = base - 10; }
    else { y += (Math.random() - 0.5) * rough; y = Math.max(h * 0.58, Math.min(h * 0.94, y)); }
    pts.push({ x:x, y:y });
  }
  // make the pad exactly flat
  var padY = null;
  pts.forEach(function(p){ if (p.x >= padX && p.x <= padX + padW){ if (padY === null) padY = p.y; p.y = padY; } });
  if (padY === null) padY = base - 10;
  LD.terrain = pts; LD.pad = { x:padX, w:padW, y:padY };
  if (!LD.stars.length) for (var i = 0; i < 60; i++) LD.stars.push({ x:Math.random(), y:Math.random() * 0.6, r:Math.random() * 1.4 + 0.3, p:Math.random() * 6 });
}
function groundAt(x){
  var t = LD.terrain; for (var i = 0; i < t.length - 1; i++){ if (x >= t[i].x && x <= t[i+1].x){ var f = (x - t[i].x) / (t[i+1].x - t[i].x); return t[i].y + (t[i+1].y - t[i].y) * f; } }
  return LD.h;
}

function landerStart(){

/* engine rumble: filtered noise that plays while thrusting */
function landerEngine(on){
  if (on && !G.muted){
    if (LD.engine) return;
    var a = SFX.ctx && SFX.ctx(); if (!a) return;
    var n = a.sampleRate, buf = a.createBuffer(1, n, n), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    var src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; src.loop = true; f.type = "lowpass"; f.frequency.value = 380; g.gain.value = 0.22;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start(); LD.engine = src;
  } else if (!on && LD.engine){ try { LD.engine.stop(); } catch(e){} LD.engine = null; }
}

function landerLoop(now){
  if (!LD.cv || !document.body.contains(LD.cv)){ LD.raf = 0; landerEngine(false); return; }
  var dt = Math.min(0.033, (now - LD.last) / 1000); LD.last = now; LD.t += dt;
  if (LD.state === "fly") landerUpdate(dt); else landerEngine(false);
  for (var i = LD.parts.length - 1; i >= 0; i--){ var p = LD.parts[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.g||0)*dt; p.life -= dt * (p.fade || 1.8); if (p.life <= 0) LD.parts.splice(i, 1); }
  landerDraw();
  LD.raf = requestAnimationFrame(landerLoop);
}

function landerUpdate(dt){
  var P = PLANETS[LD.planet], k = LD.keys, b = LD.btn;
  var up = (k.ArrowUp || k[" "] || k.w || b.up) && LD.fuel > 0;
  var lf = (k.ArrowLeft || k.a || b.left) && LD.fuel > 0, rt = (k.ArrowRight || k.d || b.right) && LD.fuel > 0;
  var ay = P.g, ax = 0;
  if (up){ ay -= LANDER.thrust; LD.fuel -= LANDER.burn * dt; }
  if (lf){ ax -= LANDER.side; LD.fuel -= LANDER.sideBurn * dt; }
  if (rt){ ax += LANDER.side; LD.fuel -= LANDER.sideBurn * dt; }
  LD.fuel = Math.max(0, LD.fuel);
  LD.vx += ax * dt; LD.vy += ay * dt; LD.x += LD.vx * dt; LD.y += LD.vy * dt;
  if (LD.x < 14){ LD.x = 14; LD.vx = Math.abs(LD.vx) * 0.3; } if (LD.x > LD.w - 14){ LD.x = LD.w - 14; LD.vx = -Math.abs(LD.vx) * 0.3; }
  if (LD.y < 16){ LD.y = 16; LD.vy = Math.max(0, LD.vy); }
  landerEngine(up);
  // flame particles
  if (up) for (var i = 0; i < 3; i++) LD.parts.push({ x:LD.x + (Math.random()-0.5)*6, y:LD.y + 16, vx:(Math.random()-0.5)*30 + LD.vx, vy:80 + Math.random()*60 + LD.vy, life:0.5, fade:2.5, c:Math.random()<0.5?"#fde047":"#f97316", r:3 });
  if (lf) LD.parts.push({ x:LD.x + 14, y:LD.y, vx:60, vy:0, life:0.3, fade:4, c:"#e0f2fe", r:2 });
  if (rt) LD.parts.push({ x:LD.x - 14, y:LD.y, vx:-60, vy:0, life:0.3, fade:4, c:"#e0f2fe", r:2 });
  // touchdown? check both feet
  var fl = LD.x - 12, fr = LD.x + 12, feet = LD.y + 16;
  if (feet >= Math.min(groundAt(fl), groundAt(fr))){
    var onPad = fl >= LD.pad.x - 2 && fr <= LD.pad.x + LD.pad.w + 2;
    var soft = LD.vy <= LANDER.safeVy && Math.abs(LD.vx) <= LANDER.safeVx;
    landerEngine(false);
    if (onPad && soft){
      LD.y = LD.pad.y - 16; LD.state = "landed";
      var pts = 100 + Math.round(LD.fuel * 2) + (LD.planet === "mars" ? 50 : LD.planet === "earth" ? 120 : 0);
      LD.score += pts; LD.level++; LD.landings++;
      if (LD.score > (LD.best[LD.planet] || 0)) LD.best[LD.planet] = LD.score;
      landerSave(); landerHud(); SFX.fanfare(); award(1, "Safe landing on " + P.name + "!");
      for (var c = 0; c < 40; c++) LD.parts.push({ x:LD.x, y:LD.y, vx:(Math.random()-0.5)*220, vy:-Math.random()*220, g:300, life:1.2, fade:0.9, c:["#facc15","#22c55e","#38bdf8","#f472b6"][c%4], r:3 });
      var note = LD.vy < 15 ? "Feather-soft touchdown! 🪶" : "Touchdown speed " + Math.round(LD.vy) + " — nice and gentle.";
      landerOverlay({ ok:true, pts:pts, note:note + " Fuel left: " + Math.round(LD.fuel) + "%" });
    } else {
      LD.state = "crashed"; SFX.brick();
      for (var e = 0; e < 50; e++) LD.parts.push({ x:LD.x, y:LD.y, vx:(Math.random()-0.5)*260, vy:-Math.random()*240, g:260, life:1.4, fade:0.8, c:["#f97316","#facc15","#6b7280","#ef4444"][e%4], r:2 + Math.random()*3 });
      var why, tip;
      if (!onPad && soft){ why = "Missed the pad!"; tip = "Use ◀ ▶ early to drift over the pad, then come straight down."; }
      else if (LD.vy > LANDER.safeVy){ why = "Too fast — crash!"; tip = LD.fuel <= 0 ? "You ran out of fuel. Wait longer before firing, then use short bursts." : "Fire the engine earlier to slow down. Gravity keeps pulling you faster and faster."; }
      else { why = "Sliding sideways — crash!"; tip = "Stop drifting before you touch down: tap the opposite arrow to cancel sideways speed."; }
      landerOverlay({ ok:false, why:why, tip:tip });
    }
  }
}

function landerDraw(){
  var c = LD.cx, w = LD.w, h = LD.h, P = PLANETS[LD.planet];
  var g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, P.sky[0]); g.addColorStop(1, P.sky[1]);

  c.globalAlpha = 1;

  if (LD.planet === "earth"){ c.fillStyle = "rgba(255,255,255,.8)"; [[0.2,0.15],[0.65,0.1]].forEach(function(cl){ var cx2 = ((cl[0]*w + LD.t*8) % (w+80)) - 40; c.beginPath(); c.arc(cx2, cl[1]*h, 14, 0, 6.28); c.arc(cx2+16, cl[1]*h+3, 11, 0, 6.28); c.arc(cx2-14, cl[1]*h+4, 10, 0, 6.28); c.fill(); }); }

    c.beginPath(); c.moveTo(0, h); LD.terrain.forEach(function(p){ c.lineTo(p.x, p.y); }); c.lineTo(w, h); c.closePath();
    c.fillStyle = P.ground; c.fill(); c.strokeStyle = P.rock; c.lineWidth = 3; c.stroke();

    c.fillStyle = "#f59e0b"; for (var s = 0; s < pd.w; s += 14) c.fillRect(pd.x + s, pd.y - 4, 7, 6);
    var blink = Math.sin(LD.t * 6) > 0;
    c.fillStyle = blink ? "#22c55e" : "#14532d"; c.beginPath(); c.arc(pd.x, pd.y - 7, 3.5, 0, 6.28); c.arc(pd.x + pd.w, pd.y - 7, 3.5, 0, 6.28); c.fill();
  }
  // lander
  if (LD.state !== "crashed" && LD.state !== "menu") drawLanderShip(c, LD.x, LD.y);
  if (LD.state === "menu"){ drawLanderShip(c, w/2, h*0.35 + Math.sin(LD.t*2)*6); }
  LD.parts.forEach(function(p){ c.globalAlpha = Math.max(0, Math.min(1, p.life)); c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.28); c.fill(); });
  c.globalAlpha = 1;
  // HUD: fuel bar + speed meter
  if (LD.state === "fly" || LD.state === "landed"){
    var P2 = PLANETS[LD.planet], fpct = LD.fuel / P2.fuel;
    c.fillStyle = "rgba(0,0,0,.45)"; rr(c, 10, 10, 128, 54, 10); c.fill();
    c.fillStyle = "#fff"; c.font = "800 11px Poppins, Arial"; c.textAlign = "left"; c.fillText("⛽ FUEL", 18, 26);
    c.fillStyle = "#374151"; rr(c, 18, 31, 110, 8, 4); c.fill();
    c.fillStyle = fpct > 0.3 ? "#22c55e" : (fpct > 0.12 ? "#f59e0b" : "#ef4444"); rr(c, 18, 31, Math.max(0, 110 * fpct), 8, 4); c.fill();
    var safe = LD.vy <= LANDER.safeVy && Math.abs(LD.vx) <= LANDER.safeVx;
    c.fillStyle = safe ? "#86efac" : "#fca5a5"; c.fillText((safe ? "✅ SAFE speed " : "⚠️ TOO FAST ") + Math.max(0, Math.round(LD.vy)), 18, 56);
    // altitude arrow to pad
    var alt = Math.max(0, Math.round(LD.pad.y - (LD.y + 16)));
    c.fillStyle = "rgba(0,0,0,.45)"; rr(c, w - 106, 10, 96, 30, 10); c.fill();
    c.fillStyle = "#fff"; c.textAlign = "center"; c.fillText("📏 height " + alt, w - 58, 30);
  }
}
function drawLanderShip(c, x, y){
  c.save(); c.translate(x, y);

  c.strokeStyle = "#cbd5e1"; c.lineWidth = 2.5; c.beginPath(); c.moveTo(-8, 6); c.lineTo(-13, 16); c.moveTo(8, 6); c.lineTo(13, 16); c.stroke();

  c.fillStyle = "#38bdf8"; c.beginPath(); c.arc(-2.5, -8.5, 1.6, 0, 6.28); c.arc(2.5, -8.5, 1.6, 0, 6.28); c.fill();
